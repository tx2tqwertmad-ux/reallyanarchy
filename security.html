<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Безопасность — REALLYANARCHY</title>
<link rel="stylesheet" href="style.css">
<style>
  .security-container {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 24px;
    margin-top: 20px;
  }
  .security-sidebar {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 0;
  }
  .security-sidebar a {
    display: block;
    padding: 10px 18px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    border-left: 3px solid transparent;
    transition: all 0.15s;
  }
  .security-sidebar a:hover {
    color: var(--text);
    background: rgba(247,183,51,0.05);
  }
  .security-sidebar a.active {
    color: var(--lime);
    border-left-color: var(--lime);
    background: rgba(247,183,51,0.08);
  }
  .security-content {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .security-content h2 {
    font-family: var(--font-display);
    font-size: 16px;
    color: var(--lime);
    margin: 0 0 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-lo);
  }
  .security-content .field {
    margin-bottom: 16px;
  }
  .security-content label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: block;
    margin-bottom: 4px;
  }
  .security-content input[type="password"],
  .security-content input[type="email"] {
    width: 100%;
    background: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 12px;
  }
  .security-content input:focus {
    outline: none;
    border-color: var(--lime);
  }
  .security-content .form-msg {
    margin-top: 12px;
  }
  .security-content .btn {
    margin-top: 8px;
  }
  .security-content .twofa-section {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border-lo);
  }
  .security-content .twofa-section h3 {
    font-size: 13px;
    color: var(--text);
    font-weight: 700;
    margin: 0 0 8px;
  }
  .security-content .twofa-section .desc {
    color: var(--text-dim);
    font-size: 13px;
  }
  .security-content .twofa-section .btn {
    margin-top: 10px;
  }

  @media (max-width: 720px) {
    .security-container {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<div id="nav-root"></div>

<main>
  <section>
    <div class="wrap">
      <h1>Безопасность</h1>

      <div class="security-container">
        <div class="security-sidebar">
          <a href="profile.html">👤 Профиль</a>
          <a href="settings.html">⚙️ Настройки</a>
          <a href="privacy.html">🔐 Конфиденциальность</a>
          <a href="security.html" class="active">🔒 Безопасность</a>
        </div>

        <div class="security-content">
          <h2>🔒 Безопасность аккаунта</h2>

          <div class="field">
            <label>Email</label>
            <input type="email" id="securityEmail" placeholder="Ваш email">
          </div>

          <div style="border-top:1px solid var(--border-lo);margin:20px 0;"></div>

          <h3 style="font-size:13px;color:var(--lime);margin-bottom:16px;">🔑 Смена пароля</h3>

          <div class="field">
            <label>Текущий пароль</label>
            <input type="password" id="currentPassword" placeholder="Введите текущий пароль">
          </div>
          <div class="field">
            <label>Новый пароль</label>
            <input type="password" id="newPassword" placeholder="Введите новый пароль (мин. 4 символа)">
          </div>
          <div class="field">
            <label>Подтверждение пароля</label>
            <input type="password" id="confirmPassword" placeholder="Подтвердите новый пароль">
          </div>

          <button class="btn primary" id="saveSecurityBtn">💾 Сохранить изменения</button>
          <div class="form-msg" id="securityMsg"></div>

          <div class="twofa-section">
            <h3>🔐 Двухфакторная аутентификация (2FA)</h3>
            <p class="desc">Добавьте дополнительный уровень защиты для Вашего аккаунта.</p>
            <button class="btn" id="enable2faBtn">Включить 2FA</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footer-root"></div>

<script src="db.js"></script>
<script src="nav.js"></script>
<script>
  renderNav('security.html');
  renderFooter();

  const user = Auth.currentUser();
  if (!user) location.href = 'auth.html';

  // Загружаем email
  try {
    const raw = localStorage.getItem('ra_db_v1');
    if (raw) {
      const data = JSON.parse(raw);
      const u = data.users.find(u => u.username === user.username);
      if (u && u.email) {
        document.getElementById('securityEmail').value = u.email;
      }
    }
  } catch(e) {}

  document.getElementById('saveSecurityBtn').addEventListener('click', function() {
    const msgEl = document.getElementById('securityMsg');
    const currentPass = document.getElementById('currentPassword').value;
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    const email = document.getElementById('securityEmail').value.trim();

    if (!currentPass && !newPass && !confirmPass) {
      msgEl.className = 'form-msg err';
      msgEl.textContent = 'Введите текущий пароль для смены.';
      return;
    }

    if (newPass.length < 4 && newPass.length > 0) {
      msgEl.className = 'form-msg err';
      msgEl.textContent = 'Новый пароль должен быть не короче 4 символов.';
      return;
    }

    if (newPass !== confirmPass) {
      msgEl.className = 'form-msg err';
      msgEl.textContent = 'Пароли не совпадают.';
      return;
    }

    try {
      const raw = localStorage.getItem('ra_db_v1');
      if (raw) {
        const data = JSON.parse(raw);
        const userIndex = data.users.findIndex(u => u.username === user.username);
        if (userIndex !== -1) {
          if (data.users[userIndex].password !== currentPass) {
            msgEl.className = 'form-msg err';
            msgEl.textContent = '❌ Неверный текущий пароль.';
            return;
          }
          if (newPass) data.users[userIndex].password = newPass;
          if (email) data.users[userIndex].email = email;
          localStorage.setItem('ra_db_v1', JSON.stringify(data));
          msgEl.className = 'form-msg ok';
          msgEl.textContent = '✅ Настройки безопасности сохранены!';
        }
      }
    } catch(e) {
      msgEl.className = 'form-msg err';
      msgEl.textContent = 'Ошибка сохранения.';
    }

    document.getElementById('currentPassword').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmPassword').value = '';

    setTimeout(() => {
      msgEl.className = 'form-msg';
      msgEl.textContent = '';
    }, 3000);
  });

  document.getElementById('enable2faBtn').addEventListener('click', function() {
    alert('🔐 Двухфакторная аутентификация будет доступна в следующем обновлении!');
  });
</script>
</body>
</html>
