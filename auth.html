<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход / Регистрация — REALLYANARCHY</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav-root"></div>

<main>
  <section>
    <div class="wrap">
      <h1>Личный кабинет</h1>

      <div class="tabs">
        <button class="tab-btn active" id="tabLoginBtn">Вход</button>
        <button class="tab-btn" id="tabRegisterBtn">Регистрация</button>
      </div>

      <div class="tab-panel active" id="tabLogin">
        <form class="panel" id="loginForm">
          <div class="field">
            <label for="loginUser">Логин</label>
            <input type="text" id="loginUser" required autocomplete="username">
          </div>
          <div class="field">
            <label for="loginPass">Пароль</label>
            <input type="password" id="loginPass" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn primary block">Войти</button>
          <div class="form-msg" id="loginMsg"></div>
        </form>
      </div>

      <div class="tab-panel" id="tabRegister">
        <form class="panel" id="registerForm">
          <div class="field">
            <label for="regUser">Логин для сайта</label>
            <input type="text" id="regUser" required autocomplete="username" minlength="3">
          </div>
          <div class="field">
            <label for="regIgn">Ник в игре (IGN)</label>
            <input type="text" id="regIgn" maxlength="24" placeholder="если отличается от логина">
          </div>
          <div class="field">
            <label for="regPass">Пароль</label>
            <input type="password" id="regPass" required autocomplete="new-password" minlength="4">
          </div>
          <button type="submit" class="btn primary block">Зарегистрироваться</button>
          <div class="form-msg" id="registerMsg"></div>
        </form>
      </div>
    </div>
  </section>
</main>

<div id="footer-root"></div>

<script src="db.js"></script>
<script src="nav.js"></script>
<script>
  renderNav('auth.html');
  renderFooter();

  // Проверяем, авторизован ли пользователь
  if (Auth.currentUser()) {
    location.href = 'index.html';
  }

  const tabLoginBtn = document.getElementById('tabLoginBtn');
  const tabRegisterBtn = document.getElementById('tabRegisterBtn');
  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');

  tabLoginBtn.addEventListener('click', function() {
    tabLoginBtn.classList.add('active');
    tabRegisterBtn.classList.remove('active');
    tabLogin.classList.add('active');
    tabRegister.classList.remove('active');
  });

  tabRegisterBtn.addEventListener('click', function() {
    tabRegisterBtn.classList.add('active');
    tabLoginBtn.classList.remove('active');
    tabRegister.classList.add('active');
    tabLogin.classList.remove('active');
  });

  // === ВХОД ===
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    const msgEl = document.getElementById('loginMsg');

    if (!username || !password) {
      msgEl.className = 'form-msg err';
      msgEl.textContent = 'Заполните все поля.';
      return;
    }

    try {
      const res = await Auth.login(username, password);
      if (res.ok) {
        location.href = 'index.html';
      } else {
        msgEl.className = 'form-msg err';
        msgEl.textContent = res.msg || 'Ошибка входа';
      }
    } catch (error) {
      console.error('Ошибка входа:', error);
      msgEl.className = 'form-msg err';
      msgEl.textContent = 'Ошибка соединения с сервером';
    }
  });

  // === РЕГИСТРАЦИЯ ===
  document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('regUser').value.trim();
    const password = document.getElementById('regPass').value;
    const ign = document.getElementById('regIgn').value.trim();
    const msgEl = document.getElementById('registerMsg');

    if (username.length < 3) {
      msgEl.className = 'form-msg err';
      msgEl.textContent = 'Логин должен быть не короче 3 символов.';
      return;
    }
    if (password.length < 4) {
      msgEl.className = 'form-msg err';
      msgEl.textContent = 'Пароль должен быть не короче 4 символов.';
      return;
    }

    try {
      const res = await Auth.register(username, password, ign);
      if (res.ok) {
        location.href = 'index.html';
      } else {
        msgEl.className = 'form-msg err';
        msgEl.textContent = res.msg || 'Ошибка регистрации';
      }
    } catch (error) {
      console.error('Ошибка регистрации:', error);
      msgEl.className = 'form-msg err';
      msgEl.textContent = 'Ошибка соединения с сервером';
    }
  });
</script>
</body>
</html>
