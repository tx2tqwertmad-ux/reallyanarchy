<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Форум — REALLYANARCHY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#0d0e0c;
    --bg-panel:#15170f;
    --bg-raised:#1c1f15;
    --bg-inset:#0a0b08;
    --border:#2b2e1f;
    --border-lo:#1e2116;
    --ore:#f2b705;
    --ore-dim:#8a6d10;
    --diamond:#5fd8c9;
    --text:#e9e7dc;
    --text-dim:#8b8f7d;
    --danger:#d9553f;
    --ok:#7ec97a;
    --font-display:'Press Start 2P', monospace;
    --font-body:'Manrope', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(180deg, rgba(242,183,5,0.04), transparent 300px),
      var(--bg-base);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.5;
  }
  a{color:var(--diamond);text-decoration:none;}
  a:hover{color:var(--ore);}
  ::selection{background:var(--ore);color:#141400;}

  header.site-head{border-bottom:3px solid var(--ore);background:var(--bg-panel);}
  .head-top{max-width:1180px;margin:0 auto;padding:18px 24px 16px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .brand .mark{width:34px;height:34px;background:var(--ore);position:relative;flex-shrink:0;clip-path:polygon(0 20%,50% 0,100% 20%,100% 80%,50% 100%,0 80%);}
  .brand .mark::after{content:"";position:absolute;inset:8px;background:var(--bg-base);clip-path:polygon(0 20%,50% 0,100% 20%,100% 80%,50% 100%,0 80%);}
  .brand .word{font-family:var(--font-display);font-size:15px;letter-spacing:1px;color:var(--text);}
  .brand .word span{color:var(--ore);}
  .head-actions{display:flex;align-items:center;gap:10px;}
  .head-search{background:var(--bg-inset);border:1px solid var(--border);color:var(--text-dim);font-family:var(--font-body);font-size:13px;padding:8px 12px;width:170px;}
  nav.site-nav{background:var(--bg-inset);border-top:1px solid var(--border-lo);}
  nav.site-nav .wrap{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;gap:2px;flex-wrap:wrap;}
  nav.site-nav a{display:block;padding:11px 14px;font-size:13px;font-weight:600;color:var(--text-dim);border-bottom:2px solid transparent;}
  nav.site-nav a:hover, nav.site-nav a.active{color:var(--text);border-bottom-color:var(--ore);}

  .btn{display:inline-block;background:var(--bg-raised);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-weight:700;font-size:13px;padding:10px 16px;cursor:pointer;transition:border-color .15s, transform .05s;white-space:nowrap;}
  .btn:hover{border-color:var(--ore);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--ore);color:#141400;border-color:var(--ore);}
  .btn.primary:hover{background:#ffca2b;}
  .btn.block{width:100%;text-align:center;}
  .btn.small{padding:6px 10px;font-size:12px;}
  .btn[disabled]{opacity:.55;cursor:not-allowed;}

  input[type=text], textarea, select{background:var(--bg-inset);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:14px;padding:10px 12px;width:100%;}
  input[type=text]:focus, textarea:focus, select:focus{outline:none;border-color:var(--diamond);}
  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
  .field{margin-bottom:14px;}
  .form-msg{font-size:13px;margin-top:8px;min-height:16px;}
  .form-msg.err{color:var(--danger);}
  .form-msg.ok{color:var(--ok);}
  .dim{color:var(--text-dim);}
  :focus-visible{outline:2px solid var(--diamond);outline-offset:2px;}

  main{max-width:1180px;margin:0 auto;padding:30px 24px 60px;}
  .page-head{margin-bottom:22px;}
  .page-head h1{font-family:var(--font-display);font-size:19px;margin:0 0 8px;letter-spacing:0.5px;}
  .page-head p{margin:0;color:var(--text-dim);font-size:14px;}
  .layout{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start;}

  .forum-section{margin-bottom:16px;}
  .forum-section-header{background:var(--bg-panel);border:1px solid var(--border);border-left:4px solid var(--ore);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .forum-section-header h3{font-size:13px;color:var(--text);margin:0;letter-spacing:0.3px;font-weight:800;}
  .forum-section-header .toggle-icon{color:var(--text-dim);font-size:11px;transition:transform 0.25s;}
  .forum-section-header .toggle-icon.open{transform:rotate(180deg);}
  .forum-section-body{background:var(--bg-panel);border:1px solid var(--border);border-top:none;overflow:hidden;max-height:0;transition:max-height .35s ease;}
  .forum-section-body.open{max-height:2000px;}
  .forum-section-body .inner{padding:6px;}

  .subforum-row{padding:12px 12px;display:grid;grid-template-columns:auto 1fr auto auto auto;gap:16px;align-items:center;cursor:pointer;border-bottom:1px solid var(--border-lo);}
  .subforum-row:last-child{border-bottom:none;}
  .subforum-row:hover{background:rgba(242,183,5,0.05);}
  .subforum-row .pip{width:6px;height:6px;background:var(--diamond);flex-shrink:0;}
  .subforum-row .name{color:var(--text);font-weight:700;font-size:14px;}
  .subforum-row .name:hover{color:var(--ore);}
  .subforum-row .count{color:var(--ore);font-weight:800;font-size:13px;white-space:nowrap;text-align:right;}
  .subforum-row .count-label{color:var(--text-dim);font-size:11px;white-space:nowrap;}
  .subforum-row .last-col{color:var(--text-dim);font-size:12px;white-space:nowrap;text-align:right;max-width:150px;}
  .subforum-row .last-col .t{color:var(--text);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .empty-row{padding:20px;text-align:center;color:var(--text-dim);font-size:13px;}
  .forum-actions{margin-top:22px;}

  .side-box{background:var(--bg-panel);border:1px solid var(--border);padding:16px 18px;margin-bottom:16px;}
  .side-box h4{font-size:11px;color:var(--ore);letter-spacing:0.5px;margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--border-lo);font-weight:800;}
  .side-item{padding:7px 0;font-size:13px;cursor:pointer;color:var(--text);border-bottom:1px solid var(--border-lo);}
  .side-item:last-child{border-bottom:none;}
  .side-item:hover{color:var(--ore);}
  .side-item .info{color:var(--text-dim);font-size:11px;margin-top:2px;}
  .online-box .users{color:var(--text);font-size:13px;line-height:1.7;}
  .online-box .users .name{color:var(--diamond);}
  .online-box .total{color:var(--text-dim);font-size:12px;margin-top:8px;}
  .social-links{display:flex;flex-direction:column;gap:8px;}
  .social-links a{font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:8px;}
  .social-links a:hover{color:var(--ore);}
  .social-links .dot{width:6px;height:6px;background:var(--diamond);flex-shrink:0;}

  .breadcrumb{font-size:12px;color:var(--text-dim);margin-bottom:16px;display:flex;gap:6px;flex-wrap:wrap;}
  .breadcrumb a{color:var(--text-dim);cursor:pointer;}
  .breadcrumb a:hover{color:var(--ore);}
  .breadcrumb .sep{color:var(--border);}
  .breadcrumb .current{color:var(--text);}

  #subforumView{display:none;}
  .subforum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .subforum-head h2{font-family:var(--font-display);font-size:17px;margin:0;}

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .filter-bar .filter-label {
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .filter-bar .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .filter-bar .filter-btn {
    background: transparent;
    border: 1px solid var(--border-lo);
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-bar .filter-btn:hover {
    border-color: var(--ore);
    color: var(--text);
  }
  .filter-bar .filter-btn.active {
    background: var(--ore);
    border-color: var(--ore);
    color: #141400;
  }
  .filter-bar .filter-btn .count {
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 0 6px;
    font-size: 10px;
    margin-left: 4px;
  }
  .filter-bar .filter-btn.active .count {
    background: rgba(0,0,0,0.15);
  }

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 16px 0;
    flex-wrap: wrap;
  }
  .pagination .page-btn {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 36px;
    text-align: center;
  }
  .pagination .page-btn:hover {
    border-color: var(--ore);
    color: var(--text);
  }
  .pagination .page-btn.active {
    background: var(--ore);
    border-color: var(--ore);
    color: #141400;
  }
  .pagination .page-btn.disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .pagination .page-info {
    color: var(--text-dim);
    font-size: 13px;
  }

  .topic-list-row{background:var(--bg-panel);border:1px solid var(--border);border-bottom:none;padding:13px 16px;display:grid;grid-template-columns:1fr auto auto auto;gap:16px;align-items:center;cursor:pointer;}
  .topic-list-row:hover{background:rgba(242,183,5,0.05);}
  .topic-list-row:last-child{border-bottom:1px solid var(--border);}
  .topic-list-row .badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border:1px solid;margin-right:8px;letter-spacing:0.3px;}
  .badge.review{color:var(--ore);border-color:var(--ore-dim);background:rgba(242,183,5,0.08);}
  .badge.fixed{color:var(--ok);border-color:#3f6a3d;background:rgba(126,201,122,0.08);}
  .badge.rejected{color:var(--danger);border-color:#7a3226;background:rgba(217,85,63,0.08);}
  .topic-list-row .t-title{color:var(--text);font-weight:700;font-size:14px;}
  .topic-list-row .t-title:hover{color:var(--ore);}
  .topic-list-row .t-meta{color:var(--text-dim);font-size:11px;margin-top:4px;}
  .topic-list-row .num-col{text-align:center;font-size:12px;color:var(--text-dim);min-width:56px;}
  .topic-list-row .num-col b{display:block;color:var(--text);font-size:14px;}
  .topic-list-row .date-col{text-align:right;font-size:12px;color:var(--text-dim);min-width:110px;}
  .topic-list-row .date-col .who{color:var(--diamond);display:block;}

  #topicView{display:none;}
  .topic-page-head{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
  .topic-page-head h2{font-family:var(--font-display);font-size:16px;line-height:1.6;margin:0 0 10px;}
  .topic-page-head .info{color:var(--text-dim);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;}
  .topic-page-head .info b{color:var(--diamond);font-weight:700;}

  .post-item{display:grid;grid-template-columns:76px 1fr;gap:16px;background:var(--bg-panel);border:1px solid var(--border);margin-bottom:10px;}
  .post-item .post-side{background:var(--bg-inset);padding:16px 10px;text-align:center;border-right:1px solid var(--border-lo);}
  .post-avatar-img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--border-lo);margin:0 auto 8px;}
  .post-avatar{width:44px;height:44px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:14px;color:#141400;border-radius:50%;}
  .post-side .post-author{color:var(--text);font-weight:800;font-size:12px;word-break:break-word;}
  .post-side .post-num{color:var(--text-dim);font-size:10px;margin-top:6px;}
  .post-body{padding:14px 16px 16px;}
  .post-body .post-time{color:var(--text-dim);font-size:11px;margin-bottom:8px;}
  .post-body .post-text{color:var(--text);font-size:14px;word-wrap:break-word;white-space:pre-wrap;}

  .reply-area{margin-top:20px;padding-top:18px;border-top:1px solid var(--border);}
  .reply-area textarea{min-height:80px;resize:vertical;margin-bottom:10px;}
  .guest-lock{background:var(--bg-panel);border:1px dashed var(--border);padding:18px;text-align:center;color:var(--text-dim);font-size:13px;margin-top:20px;}

  .topic-modal{display:none;position:fixed;inset:0;background:rgba(6,7,4,0.88);z-index:1000;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto;}
  .topic-modal.active{display:flex;}
  .topic-modal-content{background:var(--bg-panel);border:1px solid var(--border);border-top:4px solid var(--ore);padding:26px;max-width:560px;width:100%;}
  .topic-modal-content .close-modal{float:right;background:none;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;line-height:1;font-family:var(--font-body);}
  .topic-modal-content .close-modal:hover{color:var(--ore);}

  footer.site-foot{border-top:1px solid var(--border);padding:20px 24px;text-align:center;color:var(--text-dim);font-size:12px;}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .subforum-row{grid-template-columns:1fr auto;}
    .subforum-row .last-col{display:none;}
    .head-search{display:none;}
    .post-item{grid-template-columns:1fr;}
    .post-side{display:flex;align-items:center;gap:10px;text-align:left;border-right:none;border-bottom:1px solid var(--border-lo);}
    .post-avatar{margin:0;}
    .topic-list-row{grid-template-columns:1fr auto;}
    .topic-list-row .num-col, .topic-list-row .date-col{display:none;}
  }
</style>
</head>
<body>

<header class="site-head">
  <div class="head-top">
    <div class="brand" onclick="location.href='index.html'">
      <div class="mark"></div>
      <div class="word">REALLY<span>ANARCHY</span></div>
    </div>
    <div class="head-actions">
      <input type="text" class="head-search" placeholder="Поиск по форуму…" id="searchInput">
      <div id="authButtons"></div>
    </div>
  </div>
  <nav class="site-nav">
    <div class="wrap">
      <a href="index.html">Новости</a>
      <a href="rules.html">Правила</a>
      <a href="mods.html">Моды</a>
      <a href="appeal.html">Апелляция</a>
      <a href="forum.html" class="active">Форум</a>
      <a href="https://reallyanarchy.easydonate.ru/" target="_blank">Магазин</a>
    </div>
  </nav>
</header>

<main>

  <div id="listView">
    <div class="page-head">
      <h1>Форум</h1>
      <p>Обсуждения, жалобы, апелляции и жизнь сервера — всё в одном месте.</p>
    </div>

    <div class="layout">
      <div>
        <div id="forumContainer"></div>
      </div>

      <div>
        <div class="side-box">
          <h4>⭐ Рекомендуемое</h4>
          <div id="recommendedList"></div>
        </div>
        <div class="side-box">
          <h4>🔥 Популярное</h4>
          <div id="popularList"></div>
        </div>
        <div class="side-box online-box">
          <h4>👥 Онлайн</h4>
          <div class="users" id="onlineUsers"></div>
          <div class="total" id="onlineTotal"></div>
        </div>
        <div class="side-box">
          <h4>📱 Наши соцсети</h4>
          <div class="social-links">
            <a href="#" target="_blank"><span class="dot"></span>Telegram</a>
            <a href="#" target="_blank"><span class="dot"></span>Discord</a>
            <a href="#" target="_blank"><span class="dot"></span>VK</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="subforumView">
    <div class="breadcrumb" id="subforumBreadcrumb"></div>
    <div class="subforum-head">
      <h2 id="subforumTitleEl"></h2>
      <button class="btn primary" id="subforumCreateBtn">+ Создать тему</button>
    </div>

    <div class="filter-bar" id="filterBar">
      <span class="filter-label">Фильтры ▼</span>
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">Все темы <span class="count" id="filterAllCount">0</span></button>
        <button class="filter-btn" data-filter="unread">Непрочитанные <span class="count" id="filterUnreadCount">0</span></button>
        <button class="filter-btn" data-filter="my">Мои темы <span class="count" id="filterMyCount">0</span></button>
        <button class="filter-btn" data-filter="no-replies">Без ответов <span class="count" id="filterNoRepliesCount">0</span></button>
      </div>
    </div>

    <div id="subforumTopicsList"></div>

    <div class="pagination" id="pagination"></div>
  </div>

  <div id="topicView">
    <div class="breadcrumb" id="topicBreadcrumb"></div>
    <div class="topic-page-head">
      <h2 id="topicTitleEl"></h2>
      <div class="info" id="topicInfoEl"></div>
    </div>
    <div id="postsList"></div>
    <div id="replyBlock"></div>
  </div>

  <div class="topic-modal" id="topicModal">
    <div class="topic-modal-content">
      <button class="close-modal" id="closeModalBtn">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>
</main>

<footer class="site-foot">© 2026 REALLYANARCHY — Все права защищены.</footer>

<script src="db.js"></script>
<script src="nav.js"></script>
<script>
(function(){
  const API_URL = window.location.origin + '/api';

  // === АВАТАРКИ ===
  const AVATAR_COLORS = ['#f2b705', '#5fd8c9', '#d9553f', '#7ec97a', '#c98af0', '#5fa8d8', '#f7b731', '#4ecdc4'];

  function avatarColor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  function getUserAvatar(username) {
    try {
      const raw = localStorage.getItem('ra_profile_data');
      if (!raw) return null;
      const all = JSON.parse(raw);
      if (all[username] && all[username].avatar) {
        return all[username].avatar;
      }
      return null;
    } catch(e) { return null; }
  }

  // ===== ФУНКЦИИ ДЛЯ РАБОТЫ С СЕРВЕРОМ =====
  async function getTopics(sectionKey, subforumKey) {
    try {
      const res = await fetch(`${API_URL}/forum/topics/${sectionKey}/${subforumKey}`);
      return await res.json();
    } catch (e) {
      console.error('Ошибка загрузки тем:', e);
      return [];
    }
  }

  async function createTopic(sectionKey, subforumKey, title, author, text) {
    try {
      const res = await fetch(`${API_URL}/forum/topics`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sectionKey, subforumKey, title, author, text })
      });
      return await res.json();
    } catch (e) {
      console.error('Ошибка создания темы:', e);
      return { ok: false };
    }
  }

  async function getMessages(topicId) {
    try {
      const res = await fetch(`${API_URL}/forum/messages/${topicId}`);
      return await res.json();
    } catch (e) {
      console.error('Ошибка загрузки сообщений:', e);
      return [];
    }
  }

  async function addMessage(topicId, author, text, time) {
    try {
      const res = await fetch(`${API_URL}/forum/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topicId, author, text, time })
      });
      return await res.json();
    } catch (e) {
      console.error('Ошибка отправки сообщения:', e);
      return { ok: false };
    }
  }

  // ===== СТРУКТУРА РАЗДЕЛОВ =====
  const SECTIONS = {
    info: { name: 'Информация для игроков', subforums: ['rules', 'admin', 'banned'] },
    tech: { name: 'Технический раздел', subforums: ['ideas', 'bugs'] },
    complaints: { name: 'Жалобы и апелляции', subforums: ['player_reports', 'mod_reports', 'appeals'] },
    chat: { name: 'Общение', subforums: ['offtop', 'coords', 'teammate', 'builds'] }
  };

  const SUBFORUM_NAMES = {
    rules: 'Правила',
    admin: 'Администрация проекта',
    banned: 'Список запрещённых модификаций',
    ideas: 'Ваши идеи и предложения',
    bugs: 'Баги',
    player_reports: 'Жалобы на игроков',
    mod_reports: 'Жалобы на модерацию',
    appeals: 'Апелляции',
    offtop: 'Оффтоп',
    coords: 'Координаты базы',
    teammate: 'Поиск тимейта',
    builds: 'Постройки'
  };

  const SUBFORUM_LABELS = {
    bugs: '📝 Сообщить о баге',
    player_reports: '⚠️ Подать жалобу',
    mod_reports: '⚠️ Подать жалобу',
    appeals: '📨 Подать апелляцию',
    builds: '+ Поделиться постройкой'
  };

  function getSubforumLabel(key) {
    return SUBFORUM_LABELS[key] || '+ Создать тему';
  }

  let currentSectionKey = null;
  let currentSubforumKey = null;
  let currentTopics = [];
  let currentPage = 1;
  const ITEMS_PER_PAGE = 10;
  let currentFilter = 'all';

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function updateAuthButtons() {
    const container = document.getElementById('authButtons');
    const user = Auth.currentUser();
    if (user) {
      container.innerHTML = `
        <span style="color:var(--text);font-size:13px;margin-right:6px;">${escapeHtml(user.username)}</span>
        <button class="btn small" id="logoutBtn">Выйти</button>
      `;
      document.getElementById('logoutBtn').addEventListener('click', () => {
        Auth.logout();
        location.reload();
      });
    } else {
      container.innerHTML = `
        <a href="auth.html" class="btn primary small">Войти</a>
        <a href="auth.html#register" class="btn small">Регистрация</a>
      `;
    }
  }

  function renderOnline() {
    const onlineUsers = ['tufhj', 'guest1', 'guest2', 'admin'];
    document.getElementById('onlineUsers').innerHTML = onlineUsers.map(u =>
      `<span class="name">${escapeHtml(u)}</span>`
    ).join(', ');
    document.getElementById('onlineTotal').textContent = `Всего: ${onlineUsers.length} пользователей`;
  }

  // ===== ГЛАВНАЯ СТРАНИЦА =====
  async function renderForum() {
    const container = document.getElementById('forumContainer');
    let html = '';

    for (const [sKey, section] of Object.entries(SECTIONS)) {
      const isOpen = localStorage.getItem(`forum_open_${sKey}`) !== 'false';
      html += `
        <div class="forum-section">
          <div class="forum-section-header" data-section="${sKey}">
            <h3>${escapeHtml(section.name)}</h3>
            <span class="toggle-icon ${isOpen ? 'open' : ''}">▼</span>
          </div>
          <div class="forum-section-body ${isOpen ? 'open' : ''}">
            <div class="inner">
              ${section.subforums.map(fKey => {
                const name = SUBFORUM_NAMES[fKey] || fKey;
                return `
                  <div class="subforum-row" data-section="${sKey}" data-subforum="${fKey}">
                    <span class="pip"></span>
                    <div>
                      <div class="name">${escapeHtml(name)}</div>
                    </div>
                    <div>
                      <div class="count" id="count_${sKey}_${fKey}">0</div>
                      <div class="count-label">тем</div>
                    </div>
                    <div>
                      <div class="count" id="msgCount_${sKey}_${fKey}">0</div>
                      <div class="count-label">сообщ.</div>
                    </div>
                    <div class="last-col" id="last_${sKey}_${fKey}">Загрузка...</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }
    container.innerHTML = html;

    // Загружаем статистику для каждого подфорума
    for (const [sKey, section] of Object.entries(SECTIONS)) {
      for (const fKey of section.subforums) {
        const topics = await getTopics(sKey, fKey);
        const countEl = document.getElementById(`count_${sKey}_${fKey}`);
        const msgCountEl = document.getElementById(`msgCount_${sKey}_${fKey}`);
        const lastEl = document.getElementById(`last_${sKey}_${fKey}`);
        if (countEl) countEl.textContent = topics.length;
        if (msgCountEl) {
          const totalMsgs = topics.reduce((sum, t) => sum + (t.replies || 0), 0);
          msgCountEl.textContent = totalMsgs;
        }
        if (lastEl) {
          if (topics.length > 0) {
            const last = topics[0];
            lastEl.innerHTML = `<span class="t">${escapeHtml(last.title)}</span>${last.last} · ${escapeHtml(last.author)}`;
          } else {
            lastEl.textContent = 'Нет тем';
          }
        }
      }
    }

    // События
    document.querySelectorAll('.forum-section-header').forEach(header => {
      header.addEventListener('click', function() {
        const key = this.dataset.section;
        const body = this.nextElementSibling;
        const icon = this.querySelector('.toggle-icon');
        const isOpen = body.classList.toggle('open');
        icon.classList.toggle('open');
        localStorage.setItem(`forum_open_${key}`, isOpen);
      });
    });

    document.querySelectorAll('.subforum-row').forEach(el => {
      el.addEventListener('click', function() {
        openSubforum(this.dataset.section, this.dataset.subforum);
      });
    });

    updateAuthButtons();
    renderOnline();
    renderSidebar();
  }

  // ===== СТРАНИЦА ПОДФОРУМА =====
  async function openSubforum(sectionKey, subforumKey) {
    currentSectionKey = sectionKey;
    currentSubforumKey = subforumKey;
    currentPage = 1;

    const topics = await getTopics(sectionKey, subforumKey);
    currentTopics = topics;

    hideAllViews();
    document.getElementById('subforumView').style.display = 'block';
    window.scrollTo(0, 0);

    const sectionName = SECTIONS[sectionKey]?.name || sectionKey;
    const subforumName = SUBFORUM_NAMES[subforumKey] || subforumKey;

    document.getElementById('subforumBreadcrumb').innerHTML = `
      <a id="crumbForumFromSub">Форумы</a>
      <span class="sep">›</span>
      <span class="current">${escapeHtml(sectionName)}</span>
      <span class="sep">›</span>
      <span class="current">${escapeHtml(subforumName)}</span>
    `;

    document.getElementById('subforumTitleEl').textContent = subforumName;

    const createBtn = document.getElementById('subforumCreateBtn');
    createBtn.textContent = getSubforumLabel(subforumKey);
    createBtn.onclick = () => openCreateForm(sectionKey, subforumKey);

    document.getElementById('crumbForumFromSub').addEventListener('click', showSections);

    renderTopicsWithPagination(topics, 1);
  }

  // ===== ФИЛЬТРЫ И ПАГИНАЦИЯ =====
  function getFilteredTopics(topics, filter) {
    const user = Auth.currentUser();
    const username = user ? user.username : '';
    switch(filter) {
      case 'my':
        return topics.filter(t => t.author === username);
      case 'no-replies':
        return topics.filter(t => t.replies === 0);
      default:
        return topics;
    }
  }

  function renderTopicsWithPagination(topics, page) {
    const filtered = getFilteredTopics(topics, currentFilter);
    const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
    if (page > totalPages) page = totalPages;
    if (page < 1) page = 1;
    currentPage = page;

    const start = (page - 1) * ITEMS_PER_PAGE;
    const end = start + ITEMS_PER_PAGE;
    const pageTopics = filtered.slice(start, end);

    document.getElementById('filterAllCount').textContent = topics.length;
    document.getElementById('filterUnreadCount').textContent = topics.length;
    document.getElementById('filterMyCount').textContent = topics.filter(t => t.author === (Auth.currentUser() ? Auth.currentUser().username : '')).length;
    document.getElementById('filterNoRepliesCount').textContent = topics.filter(t => t.replies === 0).length;

    const container = document.getElementById('subforumTopicsList');
    if (pageTopics.length === 0) {
      container.innerHTML = '<div class="empty-row">Нет тем, соответствующих фильтру</div>';
    } else {
      container.innerHTML = pageTopics.map(t => `
        <div class="topic-list-row" data-topic="${t.id}">
          <div class="main-col">
            <span class="t-title">${escapeHtml(t.title)}</span>
            <div class="t-meta">Автор: ${escapeHtml(t.author)} · ${t.last}</div>
          </div>
          <div class="num-col"><b>${t.replies}</b>ответы</div>
          <div class="num-col"><b>${t.views || 0}</b>просм.</div>
          <div class="date-col">${t.last}<span class="who">${escapeHtml(t.author)}</span></div>
        </div>
      `).join('');
    }

    // Пагинация
    const pagination = document.getElementById('pagination');
    let pagHtml = '';
    pagHtml += `<button class="page-btn ${page <= 1 ? 'disabled' : ''}" data-page="${page - 1}">‹</button>`;
    
    const maxVisible = 5;
    let startPage = Math.max(1, page - Math.floor(maxVisible / 2));
    let endPage = Math.min(totalPages, startPage + maxVisible - 1);
    if (endPage - startPage < maxVisible - 1) startPage = Math.max(1, endPage - maxVisible + 1);
    
    if (startPage > 1) pagHtml += `<button class="page-btn" data-page="1">1</button>${startPage > 2 ? '<span class="page-btn" style="background:transparent;border:none;cursor:default;">…</span>' : ''}`;
    
    for (let i = startPage; i <= endPage; i++) {
      pagHtml += `<button class="page-btn ${i === page ? 'active' : ''}" data-page="${i}">${i}</button>`;
    }
    
    if (endPage < totalPages) pagHtml += `${endPage < totalPages - 1 ? '<span class="page-btn" style="background:transparent;border:none;cursor:default;">…</span>' : ''}<button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
    
    pagHtml += `<button class="page-btn ${page >= totalPages ? 'disabled' : ''}" data-page="${page + 1}">›</button>`;
    pagHtml += `<span class="page-info">${page} / ${totalPages}</span>`;
    pagination.innerHTML = pagHtml;

    pagination.querySelectorAll('.page-btn:not(.disabled)').forEach(btn => {
      btn.addEventListener('click', function() {
        const newPage = parseInt(this.dataset.page);
        if (newPage && newPage >= 1 && newPage <= totalPages) {
          renderTopicsWithPagination(topics, newPage);
        }
      });
    });

    container.querySelectorAll('.topic-list-row').forEach(el => {
      el.addEventListener('click', function() {
        openTopic(parseInt(this.dataset.topic));
      });
    });
  }

  // Фильтры
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      renderTopicsWithPagination(currentTopics, 1);
    });
  });

  // ===== СОЗДАНИЕ ТЕМЫ =====
  function openCreateForm(sectionKey, subforumKey) {
    const modal = document.getElementById('topicModal');
    const content = document.getElementById('modalContent');

    content.innerHTML = `
      <h2 style="margin-bottom:16px;font-size:17px;">Создать тему</h2>
      <form id="newTopicForm">
        <div class="field">
          <label for="topicTitle">Заголовок</label>
          <input type="text" id="topicTitle" required maxlength="80" placeholder="Название темы">
        </div>
        <div class="field">
          <label for="topicText">Текст</label>
          <textarea id="topicText" required maxlength="600" placeholder="Что вы хотите сказать?"></textarea>
        </div>
        <button type="submit" class="btn primary block">Опубликовать</button>
        <div class="form-msg" id="topicMsg"></div>
      </form>
    `;

    modal.classList.add('active');

    document.getElementById('newTopicForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const title = document.getElementById('topicTitle').value.trim();
      const text = document.getElementById('topicText').value.trim();
      const msgEl = document.getElementById('topicMsg');

      if (!title || !text) {
        msgEl.className = 'form-msg err';
        msgEl.textContent = 'Заполните все поля.';
        return;
      }

      const user = Auth.currentUser();
      const author = user ? user.username : 'Гость';

      const result = await createTopic(sectionKey, subforumKey, title, author, text);
      if (result.ok) {
        msgEl.className = 'form-msg ok';
        msgEl.textContent = 'Тема создана!';
        setTimeout(() => {
          modal.classList.remove('active');
          openSubforum(sectionKey, subforumKey);
        }, 500);
      } else {
        msgEl.className = 'form-msg err';
        msgEl.textContent = 'Ошибка создания темы';
      }
    });
  }

  // ===== СТРАНИЦА ТЕМЫ =====
  function renderReplyBlock(topicId) {
    const user = Auth.currentUser();
    const block = document.getElementById('replyBlock');
    if (!user) {
      block.innerHTML = `
        <div class="guest-lock">
          Только авторизованные пользователи могут отвечать в теме.
          <div style="margin-top:12px;">
            <a href="auth.html" class="btn primary small">Войдите, чтобы ответить</a>
          </div>
        </div>
      `;
      return;
    }
    block.innerHTML = `
      <div class="reply-area">
        <textarea id="replyText" placeholder="Напишите ответ…"></textarea>
        <button class="btn primary" id="replyBtn">Ответить</button>
        <div class="form-msg" id="replyMsg"></div>
      </div>
    `;
    document.getElementById('replyBtn').addEventListener('click', async function() {
      const replyText = document.getElementById('replyText').value.trim();
      const replyMsg = document.getElementById('replyMsg');
      if (!replyText) {
        replyMsg.className = 'form-msg err';
        replyMsg.textContent = 'Напишите текст ответа.';
        return;
      }
      const user = Auth.currentUser();
      const now = new Date().toLocaleDateString('ru-RU') + ' ' + new Date().toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
      const result = await addMessage(topicId, user.username, replyText, now);
      if (result.ok) {
        openTopic(topicId);
      } else {
        replyMsg.className = 'form-msg err';
        replyMsg.textContent = 'Ошибка отправки ответа';
      }
    });
  }

  async function openTopic(topicId) {
    const messages = await getMessages(topicId);
    if (messages.length === 0) {
      alert('Тема не найдена');
      return;
    }

    const topic = currentTopics.find(t => t.id === topicId);
    if (!topic) return;

    hideAllViews();
    document.getElementById('topicView').style.display = 'block';
    window.scrollTo(0, 0);

    const sectionName = SECTIONS[currentSectionKey]?.name || currentSectionKey;
    const subforumName = SUBFORUM_NAMES[currentSubforumKey] || currentSubforumKey;

    document.getElementById('topicBreadcrumb').innerHTML = `
      <a id="crumbForum">Форумы</a>
      <span class="sep">›</span>
      <a id="crumbSection">${escapeHtml(sectionName)}</a>
      <span class="sep">›</span>
      <a id="crumbSubforum">${escapeHtml(subforumName)}</a>
      <span class="sep">›</span>
      <span class="current">${escapeHtml(topic.title)}</span>
    `;

    document.getElementById('topicTitleEl').textContent = topic.title;
    document.getElementById('topicInfoEl').innerHTML = `
      <span>Автор: <b>${escapeHtml(topic.author)}</b></span>
      <span>${topic.last}</span>
      <span>${topic.views || 0} просмотров</span>
      <span>${topic.replies} ответов</span>
    `;

    // === СООБЩЕНИЯ С АВАТАРКАМИ ===
    document.getElementById('postsList').innerHTML = messages.map((msg, i) => {
      const author = msg.author || 'Гость';
      const avatar = getUserAvatar(author);
      return `
        <div class="post-item">
          <div class="post-side">
            ${avatar 
              ? `<img src="${avatar}" class="post-avatar-img" alt="${escapeHtml(author)}">`
              : `<div class="post-avatar" style="background:${avatarColor(author)};">${escapeHtml(author.slice(0,1).toUpperCase())}</div>`
            }
            <div class="post-author">${escapeHtml(author)}</div>
            <div class="post-num">#${i + 1}</div>
          </div>
          <div class="post-body">
            <div class="post-time">${escapeHtml(msg.time || 'недавно')}</div>
            <div class="post-text">${escapeHtml(msg.text)}</div>
          </div>
        </div>
      `;
    }).join('');

    renderReplyBlock(topicId);

    document.getElementById('crumbForum').addEventListener('click', showSections);
    document.getElementById('crumbSection').addEventListener('click', showSections);
    document.getElementById('crumbSubforum').addEventListener('click', () => openSubforum(currentSectionKey, currentSubforumKey));
  }

  // ===== БОКОВАЯ ПАНЕЛЬ =====
  function renderSidebar() {
    const allTopics = currentTopics || [];
    const rec = allTopics.slice(0, 3);
    document.getElementById('recommendedList').innerHTML = rec.map(t => `
      <div class="side-item" onclick="openTopic(${t.id})">
        ${escapeHtml(t.title)}
        <div class="info">${t.last} · Ответов: ${t.replies}</div>
      </div>
    `).join('') || '<div class="dim" style="padding:4px 0;">Пока нечего показать</div>';

    const sorted = [...allTopics].sort((a, b) => b.replies - a.replies).slice(0, 5);
    document.getElementById('popularList').innerHTML = sorted.map(t => `
      <div class="side-item" onclick="openTopic(${t.id})">
        ${escapeHtml(t.title)}
        <div class="info">${t.last} · Ответов: ${t.replies}</div>
      </div>
    `).join('') || '<div class="dim" style="padding:4px 0;">Пока нечего показать</div>';
  }

  // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
  function hideAllViews() {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('subforumView').style.display = 'none';
    document.getElementById('topicView').style.display = 'none';
  }

  function showSections() {
    hideAllViews();
    document.getElementById('listView').style.display = 'block';
    window.scrollTo(0, 0);
    renderForum();
  }

  // ===== ПОИСК =====
  document.getElementById('searchInput').addEventListener('input', function() {
    const query = this.value.toLowerCase().trim();
    const items = document.querySelectorAll('.subforum-row, .topic-list-row');
    items.forEach(el => {
      const text = el.textContent.toLowerCase();
      el.style.display = text.includes(query) ? '' : 'none';
    });
  });

  // ===== ЗАКРЫТИЕ МОДАЛКИ =====
  document.getElementById('closeModalBtn').addEventListener('click', () => {
    document.getElementById('topicModal').classList.remove('active');
  });
  document.getElementById('topicModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) document.getElementById('topicModal').classList.remove('active');
  });

  // ===== ЗАПУСК =====
  window.openTopic = openTopic;
  window.openSubforum = openSubforum;

  showSections();
})();
</script>
</body>
