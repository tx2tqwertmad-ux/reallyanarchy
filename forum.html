<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Форум — REALLYANARCHY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#0d0e0c;
    --bg-panel:#15170f;
    --bg-raised:#1c1f15;
    --bg-inset:#0a0b08;
    --border:#2b2e1f;
    --border-lo:#1e2116;
    --ore:#f2b705;
    --ore-dim:#8a6d10;
    --diamond:#5fd8c9;
    --text:#e9e7dc;
    --text-dim:#8b8f7d;
    --danger:#d9553f;
    --ok:#7ec97a;
    --font-display:'Press Start 2P', monospace;
    --font-body:'Manrope', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(180deg, rgba(242,183,5,0.04), transparent 300px),
      var(--bg-base);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.5;
  }
  a{color:var(--diamond);text-decoration:none;}
  a:hover{color:var(--ore);}
  ::selection{background:var(--ore);color:#141400;}

  .btn{display:inline-block;background:var(--bg-raised);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-weight:700;font-size:13px;padding:10px 16px;cursor:pointer;transition:border-color .15s, transform .05s;white-space:nowrap;}
  .btn:hover{border-color:var(--ore);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--ore);color:#141400;border-color:var(--ore);}
  .btn.primary:hover{background:#ffca2b;}
  .btn.block{width:100%;text-align:center;}
  .btn.small{padding:6px 10px;font-size:12px;}
  .btn[disabled]{opacity:.55;cursor:not-allowed;}

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 12px;
    transition: color 0.2s;
    background: none;
    border: none;
    padding: 6px 12px;
    border-radius: var(--radius);
    font-family: var(--font-body);
  }
  .back-link:hover {
    color: var(--ore);
    background: rgba(242,183,5,0.06);
  }

  input[type=text], textarea, select{background:var(--bg-inset);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:14px;padding:10px 12px;width:100%;}
  input[type=text]:focus, textarea:focus, select:focus{outline:none;border-color:var(--diamond);}
  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
  .field{margin-bottom:14px;}
  .form-msg{font-size:13px;margin-top:8px;min-height:16px;}
  .form-msg.err{color:var(--danger);}
  .form-msg.ok{color:var(--ok);}
  .dim{color:var(--text-dim);}
  :focus-visible{outline:2px solid var(--diamond);outline-offset:2px;}

  main{max-width:1180px;margin:0 auto;padding:30px 24px 60px;}
  .page-head{margin-bottom:22px;}
  .page-head h1{font-family:var(--font-display);font-size:19px;margin:0 0 8px;letter-spacing:0.5px;}
  .page-head p{margin:0;color:var(--text-dim);font-size:14px;}
  .layout{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start;}

  .forum-section{margin-bottom:16px;}
  .forum-section-header{background:var(--bg-panel);border:1px solid var(--border);border-left:4px solid var(--ore);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .forum-section-header h3{font-size:13px;color:var(--text);margin:0;letter-spacing:0.3px;font-weight:800;}
  .forum-section-header .toggle-icon{color:var(--text-dim);font-size:11px;transition:transform 0.25s;}
  .forum-section-header .toggle-icon.open{transform:rotate(180deg);}
  .forum-section-body{background:var(--bg-panel);border:1px solid var(--border);border-top:none;overflow:hidden;max-height:0;transition:max-height .35s ease;}
  .forum-section-body.open{max-height:2000px;}
  .forum-section-body .inner{padding:6px;}

  .subforum-row{padding:12px 12px;display:grid;grid-template-columns:auto 1fr auto auto auto;gap:16px;align-items:center;cursor:pointer;border-bottom:1px solid var(--border-lo);}
  .subforum-row:last-child{border-bottom:none;}
  .subforum-row:hover{background:rgba(242,183,5,0.05);}
  .subforum-row .pip{width:6px;height:6px;background:var(--diamond);flex-shrink:0;}
  .subforum-row .name{color:var(--text);font-weight:700;font-size:14px;}
  .subforum-row .name:hover{color:var(--ore);}
  .subforum-row .count{color:var(--ore);font-weight:800;font-size:13px;white-space:nowrap;text-align:right;}
  .subforum-row .count-label{color:var(--text-dim);font-size:11px;white-space:nowrap;}
  .subforum-row .last-col{color:var(--text-dim);font-size:12px;white-space:nowrap;text-align:right;max-width:150px;}
  .subforum-row .last-col .t{color:var(--text);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .empty-row{padding:20px;text-align:center;color:var(--text-dim);font-size:13px;}
  .forum-actions{margin-top:22px;}

  .side-box{background:var(--bg-panel);border:1px solid var(--border);padding:16px 18px;margin-bottom:16px;}
  .side-box h4{font-size:11px;color:var(--ore);letter-spacing:0.5px;margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--border-lo);font-weight:800;}
  .side-item{padding:7px 0;font-size:13px;cursor:pointer;color:var(--text);border-bottom:1px solid var(--border-lo);}
  .side-item:last-child{border-bottom:none;}
  .side-item:hover{color:var(--ore);}
  .side-item .info{color:var(--text-dim);font-size:11px;margin-top:2px;}
  .online-box .users{color:var(--text);font-size:13px;line-height:1.7;}
  .online-box .users .name{color:var(--diamond);}
  .online-box .total{color:var(--text-dim);font-size:12px;margin-top:8px;}
  .social-links{display:flex;flex-direction:column;gap:8px;}
  .social-links a{font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:8px;}
  .social-links a:hover{color:var(--ore);}
  .social-links .dot{width:6px;height:6px;background:var(--diamond);flex-shrink:0;}

  .breadcrumb{font-size:12px;color:var(--text-dim);margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap;}
  .breadcrumb a{color:var(--text-dim);cursor:pointer;}
  .breadcrumb a:hover{color:var(--ore);}
  .breadcrumb .sep{color:var(--border);}
  .breadcrumb .current{color:var(--text);}

  #subforumView{display:none;}
  .subforum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .subforum-head h2{font-family:var(--font-display);font-size:17px;margin:0;}

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .filter-bar .filter-label {
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .filter-bar .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .filter-bar .filter-btn {
    background: transparent;
    border: 1px solid var(--border-lo);
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-bar .filter-btn:hover {
    border-color: var(--ore);
    color: var(--text);
  }
  .filter-bar .filter-btn.active {
    background: var(--ore);
    border-color: var(--ore);
    color: #141400;
  }
  .filter-bar .filter-btn .count {
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 0 6px;
    font-size: 10px;
    margin-left: 4px;
  }
  .filter-bar .filter-btn.active .count {
    background: rgba(0,0,0,0.15);
  }

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 16px 0;
    flex-wrap: wrap;
  }
  .pagination .page-btn {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 36px;
    text-align: center;
  }
  .pagination .page-btn:hover {
    border-color: var(--ore);
    color: var(--text);
  }
  .pagination .page-btn.active {
    background: var(--ore);
    border-color: var(--ore);
    color: #141400;
  }
  .pagination .page-btn.disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .pagination .page-info {
    color: var(--text-dim);
    font-size: 13px;
  }

  .topic-list-row{background:var(--bg-panel);border:1px solid var(--border);border-bottom:none;padding:13px 16px;display:grid;grid-template-columns:1fr auto auto auto;gap:16px;align-items:center;cursor:pointer;}
  .topic-list-row:hover{background:rgba(242,183,5,0.05);}
  .topic-list-row:last-child{border-bottom:1px solid var(--border);}
  .topic-list-row .t-title{color:var(--text);font-weight:700;font-size:14px;}
  .topic-list-row .t-title:hover{color:var(--ore);}
  .topic-list-row .t-meta{color:var(--text-dim);font-size:11px;margin-top:4px;}
  .topic-list-row .num-col{text-align:center;font-size:12px;color:var(--text-dim);min-width:56px;}
  .topic-list-row .num-col b{display:block;color:var(--text);font-size:14px;}
  .topic-list-row .date-col{text-align:right;font-size:12px;color:var(--text-dim);min-width:110px;}
  .topic-list-row .date-col .who{color:var(--diamond);display:block;}

  #topicView{display:none;}
  .topic-page-head{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
  .topic-page-head h2{font-family:var(--font-display);font-size:16px;line-height:1.6;margin:0 0 10px;}
  .topic-page-head .info{color:var(--text-dim);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;}
  .topic-page-head .info b{color:var(--diamond);font-weight:700;}

  .post-item{display:grid;grid-template-columns:76px 1fr;gap:16px;background:var(--bg-panel);border:1px solid var(--border);margin-bottom:10px;}
  .post-item .post-side{background:var(--bg-inset);padding:16px 10px;text-align:center;border-right:1px solid var(--border-lo);}
  .post-avatar-img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--border-lo);margin:0 auto 8px;cursor:pointer;}
  .post-avatar-img:hover{border-color:var(--ore);}
  .post-avatar{width:44px;height:44px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:14px;color:#141400;border-radius:50%;cursor:pointer;}
  .post-avatar:hover{outline:2px solid var(--ore);outline-offset:2px;}
  .post-side .post-author{color:var(--text);font-weight:800;font-size:12px;word-break:break-word;cursor:pointer;}
  .post-side .post-author:hover{color:var(--ore);}
  .post-side .post-num{color:var(--text-dim);font-size:10px;margin-top:6px;}
  .post-body{padding:14px 16px 16px;}
  .post-body .post-time{color:var(--text-dim);font-size:11px;margin-bottom:8px;}
  .post-body .post-text{color:var(--text);font-size:14px;word-wrap:break-word;white-space:pre-wrap;}
  .post-body .post-text.rich{white-space:normal;}
  .post-body .post-text.rich blockquote{border-left:3px solid var(--ore);padding-left:10px;margin:8px 0;color:var(--text-dim);}
  .post-body .post-text.rich ul, .post-body .post-text.rich ol{padding-left:22px;margin:6px 0;}
  .post-body img.msg-image{max-width:300px;max-height:300px;display:block;margin-top:10px;border:1px solid var(--border);border-radius:var(--radius);object-fit:cover;}
  @media (max-width:600px){.post-body img.msg-image{max-width:100%;max-height:250px;}}

  .reply-area{margin-top:20px;padding-top:18px;border-top:1px solid var(--border);}
  .guest-lock{background:var(--bg-panel);border:1px dashed var(--border);padding:18px;text-align:center;color:var(--text-dim);font-size:13px;margin-top:20px;}

  .editor-wrap{display:flex;gap:14px;align-items:flex-start;}
  .editor-avatar{width:60px;height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:18px;color:#141400;border-radius:50%;}
  .editor-box{flex:1;min-width:0;background:var(--bg-panel);border:1px solid var(--border);border-top:3px solid var(--ore);}
  .editor-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:7px 9px;border-bottom:1px solid var(--border-lo);background:var(--bg-raised);}
  .editor-toolbar button{background:none;border:1px solid transparent;color:var(--text);font-size:14px;width:30px;height:28px;cursor:pointer;line-height:1;}
  .editor-toolbar button:hover{background:var(--bg-inset);border-color:var(--border);}
  .editor-toolbar .tb-sep{width:1px;height:20px;background:var(--border);margin:0 5px;flex-shrink:0;}
  .editor-content{min-height:120px;max-height:420px;overflow-y:auto;padding:12px 14px;font-size:14px;color:var(--text);outline:none;line-height:1.55;}
  .editor-content:empty:before{content:attr(data-placeholder);color:var(--text-dim);}
  .editor-content blockquote{border-left:3px solid var(--ore);padding-left:10px;margin:8px 0;color:var(--text-dim);}
  .editor-content img{max-width:100%;margin-top:6px;display:block;}
  .editor-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:10px;}

  .composer-toolbar{display:flex;gap:8px;margin-top:8px;}
  .composer-toolbar button{background:var(--bg-raised);border:1px solid var(--border);color:var(--text);font-size:16px;padding:6px 11px;cursor:pointer;line-height:1;}
  .composer-toolbar button:hover{border-color:var(--ore);}
  .composer-attach-input{display:none;}
  .composer-image-preview{position:relative;display:inline-block;margin-top:10px;}
  .composer-image-preview img{max-width:120px;max-height:100px;display:block;border:1px solid var(--border);border-radius:var(--radius);object-fit:cover;}
  .composer-image-preview .remove-img{position:absolute;top:-9px;right:-9px;background:var(--danger);color:#fff;border:none;width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1;border-radius:50%;}

  .topic-modal{display:none;position:fixed;inset:0;background:rgba(6,7,4,0.88);z-index:1000;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto;}
  .topic-modal.active{display:flex;}
  .topic-modal-content{background:var(--bg-panel);border:1px solid var(--border);border-top:4px solid var(--ore);padding:26px;max-width:560px;width:100%;}
  .topic-modal-content .close-modal{float:right;background:none;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;line-height:1;font-family:var(--font-body);}
  .topic-modal-content .close-modal:hover{color:var(--ore);}

  .profile-card{position:fixed;z-index:1300;width:300px;background:var(--bg-panel);border:1px solid var(--border);border-top:3px solid var(--ore);box-shadow:0 16px 34px rgba(0,0,0,0.55);display:none;border-radius:var(--radius);}
  .profile-card.active{display:block;}
  .profile-card-head{display:flex;align-items:flex-start;gap:12px;padding:14px 40px 10px 14px;position:relative;}
  .profile-card-avatar{width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:16px;color:#141400;border-radius:50%;}
  .profile-card-avatar img{width:48px;height:48px;border-radius:50%;object-fit:cover;}
  .profile-card-name{font-weight:800;font-size:14px;color:var(--text);}
  .profile-card-status{font-size:11px;margin-top:3px;}
  .profile-card-status.online{color:var(--ok);}
  .profile-card-status.offline{color:var(--text-dim);}
  .profile-card-role{display:inline-block;margin:2px 14px 0;font-size:11px;font-weight:800;color:var(--ore);border:1px solid var(--ore-dim);background:rgba(242,183,5,0.08);padding:2px 8px;}
  .profile-card-more{background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;position:absolute;top:10px;right:10px;line-height:1;padding:4px 6px;}
  .profile-card-more:hover{color:var(--ore);}
  .profile-card-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px;border-top:1px solid var(--border-lo);border-bottom:1px solid var(--border-lo);margin-top:12px;}
  .profile-card-stats div{text-align:center;}
  .profile-card-stats b{display:block;color:var(--text);font-size:13px;}
  .profile-card-stats span{color:var(--text-dim);font-size:9px;text-transform:uppercase;letter-spacing:0.3px;}
  .profile-card-actions{display:flex;gap:6px;padding:12px 14px;flex-wrap:wrap;}
  .profile-card-actions .btn{flex:1;min-width:80px;}
  .profile-dropdown{position:absolute;top:40px;right:8px;background:var(--bg-raised);border:1px solid var(--border);width:220px;z-index:1310;display:none;}
  .profile-dropdown.active{display:block;}
  .profile-dropdown .item{padding:9px 12px;font-size:12px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border-lo);}
  .profile-dropdown .item:last-child{border-bottom:none;}
  .profile-dropdown .item:hover{background:var(--bg-inset);color:var(--ore);}
  .profile-dropdown .label{padding:8px 12px 4px;font-size:10px;color:var(--text-dim);text-transform:uppercase;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-raised);border:1px solid var(--ore);color:var(--text);padding:10px 20px;font-size:13px;z-index:1400;display:none;border-radius:var(--radius);}
  .toast.active{display:block;}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .subforum-row{grid-template-columns:1fr auto;}
    .subforum-row .last-col{display:none;}
    .post-item{grid-template-columns:1fr;}
    .post-side{display:flex;align-items:center;gap:10px;text-align:left;border-right:none;border-bottom:1px solid var(--border-lo);}
    .post-avatar{margin:0;}
    .topic-list-row{grid-template-columns:1fr auto;}
    .topic-list-row .num-col, .topic-list-row .date-col{display:none;}
    .profile-card{width:88vw;}
    .editor-avatar{width:40px;height:40px;font-size:14px;}
  }
</style>
</head>
<body>

<!-- ===== ТВОЯ ШАПКА (через nav.js) ===== -->
<div id="nav-root"></div>

<main>
  <div id="listView">
    <div class="page-head">
      <h1>Форум</h1>
      <p>Обсуждения, жалобы, апелляции и жизнь сервера — всё в одном месте.</p>
    </div>

    <div class="layout">
      <div>
        <div id="forumContainer"></div>
      </div>

      <div>
        <div class="side-box">
          <h4>⭐ Рекомендуемое</h4>
          <div id="recommendedList"></div>
        </div>
        <div class="side-box">
          <h4>🔥 Популярное</h4>
          <div id="popularList"></div>
        </div>
        <div class="side-box online-box">
          <h4>👥 Онлайн</h4>
          <div class="users" id="onlineUsers"></div>
          <div class="total" id="onlineTotal"></div>
        </div>
        <div class="side-box">
          <h4>📱 Наши соцсети</h4>
          <div class="social-links">
            <a href="#" target="_blank"><span class="dot"></span>Telegram</a>
            <a href="#" target="_blank"><span class="dot"></span>Discord</a>
            <a href="#" target="_blank"><span class="dot"></span>VK</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="subforumView">
    <button class="back-link" id="backFromSubforum">← Назад к форумам</button>
    <div class="breadcrumb" id="subforumBreadcrumb"></div>
    <div class="subforum-head">
      <h2 id="subforumTitleEl"></h2>
      <button class="btn primary" id="subforumCreateBtn">+ Создать тему</button>
    </div>

    <div class="filter-bar">
      <span class="filter-label">Фильтры ▼</span>
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">Все темы <span class="count" id="filterAllCount">0</span></button>
        <button class="filter-btn" data-filter="my">Мои темы <span class="count" id="filterMyCount">0</span></button>
        <button class="filter-btn" data-filter="no-replies">Без ответов <span class="count" id="filterNoRepliesCount">0</span></button>
      </div>
    </div>

    <div id="subforumTopicsList"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div id="topicView">
    <button class="back-link" id="backFromTopic">← Назад к разделам</button>
    <button class="back-link" id="backToMainFromTopic" style="margin-left:8px;">← На главную форума</button>
    <div class="breadcrumb" id="topicBreadcrumb"></div>

<!-- ===== ТВОЙ ФУТЕР (через nav.js) ===== -->
<div id="footer-root"></div>

<div class="profile-card" id="profileCard"></div>
<div class="toast" id="toast"></div>

<script src="db.js"></script>
<script src="nav.js"></script>
<script>
  // ===== РЕНДЕРИМ ШАПКУ И ФУТЕР =====
  renderNav('forum.html');
  renderFooter();

  // ===== ОСТАЛЬНОЙ КОД =====
  (function(){
  const API_URL = window.location.origin + '/api';
  const FORUM_KEY = 'ra_forum_v4';

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function avatarColor(name) {
    const colors = ['#f2b705', '#5fd8c9', '#d9553f', '#7ec97a', '#c98af0', '#5fa8d8', '#f7b731', '#4ecdc4'];
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return colors[h % colors.length];
  }

  function getUserAvatar(username) {
    try {
      const raw = localStorage.getItem('ra_profile_data');
      if (!raw) return null;
      const all = JSON.parse(raw);
      if (all[username] && all[username].avatar) {
        return all[username].avatar;
      }
      return null;
    } catch(e) { return null; }
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('active');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('active'), 2400);
  }

  function sanitizeHtml(html) {
    const div = document.createElement('div');
    div.innerHTML = html;
    div.querySelectorAll('script,style,iframe,object,embed').forEach(el => el.remove());
    div.querySelectorAll('*').forEach(el => {
      [...el.attributes].forEach(attr => {
        if (/^on/i.test(attr.name)) el.removeAttribute(attr.name);
        if ((attr.name === 'href' || attr.name === 'src') && /^\s*javascript:/i.test(attr.value)) el.removeAttribute(attr.name);
      });
    });
    return div.innerHTML;
  }

  function getDefaultForum() {
    return {
      sections: {
        info: {
          name: 'Информация для игроков',
          open: true,
          subforums: {
            rules: { name: 'Правила', createLabel: '+ Создать тему', fields: null, topics: [] },
            admin: { name: 'Администрация проекта', createLabel: '+ Создать тему', fields: null, topics: [] },
            banned: { name: 'Список запрещённых модификаций', createLabel: '+ Создать тему', fields: null, topics: [] }
          }
        },
        tech: {
          name: 'Технический раздел',
          open: true,
          subforums: {
            ideas: { name: 'Ваши идеи и предложения', createLabel: '+ Предложить идею', fields: null, topics: [] },
            bugs: { name: 'Баги', createLabel: '📝 Сообщить о баге', fields: [
              { key: 'desc', label: 'Описание бага' },
              { key: 'steps', label: 'Шаги воспроизведения' },
              { key: 'where', label: 'Где встретил' }
            ], topics: [] }
          }
        },
        complaints: {
          name: 'Жалобы и апелляции',
          open: true,
          subforums: {
            player_reports: { name: 'Жалобы на игроков', createLabel: '⚠️ Подать жалобу', fields: [
              { key: 'target', label: 'На кого жалоба' },
              { key: 'desc', label: 'Суть жалобы' },
              { key: 'proof', label: 'Пруфы' }
            ], topics: [] },
            mod_reports: { name: 'Жалобы на модерацию', createLabel: '⚠️ Подать жалобу', fields: [
              { key: 'target', label: 'На кого жалоба' },
              { key: 'desc', label: 'Суть жалобы' }
            ], topics: [] },
            appeals: { name: 'Апелляции', createLabel: '📨 Подать апелляцию', fields: [
              { key: 'nick', label: 'Ваш ник' },
              { key: 'reason', label: 'Причина бана' },
              { key: 'why', label: 'Почему нужно снять бан' }
            ], topics: [] }
          }
        },
        chat: {
          name: 'Общение',
          open: true,
          subforums: {
            offtop: { name: 'Оффтоп', createLabel: '+ Создать тему', fields: null, topics: [] },
            coords: { name: 'Координаты базы', createLabel: '+ Создать тему', fields: null, topics: [] },
            teammate: { name: 'Поиск тимейта', createLabel: '+ Создать тему', fields: null, topics: [] },
            builds: { name: 'Постройки', createLabel: '+ Поделиться постройкой', fields: null, topics: [] }
          }
        }
      },
      messages: {},
      online: []
    };
  }

  let storageOk = true;
  try { localStorage.setItem('__probe__', '1'); localStorage.removeItem('__probe__'); } catch(e) { storageOk = false; }

  function getForumData() {
    if (!storageOk) return getDefaultForum();
    const raw = localStorage.getItem(FORUM_KEY);
    if (raw) {
      try {
        const data = JSON.parse(raw);
        const def = getDefaultForum();
        for (const key of Object.keys(def.sections)) {
          if (!data.sections[key]) data.sections[key] = def.sections[key];
        }
        return data;
      } catch(e) {}
    }
    const def = getDefaultForum();
    try { localStorage.setItem(FORUM_KEY, JSON.stringify(def)); } catch(e) {}
    return def;
  }

  function saveForumData(data) {
    if (!storageOk) return;
    try { localStorage.setItem(FORUM_KEY, JSON.stringify(data)); } catch(e) {}
  }

  let forumData = getForumData();
  let currentSectionKey = null;
  let currentSubforumKey = null;
  let currentTopics = [];
  let currentPage = 1;
  const ITEMS_PER_PAGE = 10;
  let currentFilter = 'all';

  const SUBFORUM_NAMES = {
    rules: 'Правила',
    admin: 'Администрация проекта',
    banned: 'Список запрещённых модификаций',
    ideas: 'Ваши идеи и предложения',
    bugs: 'Баги',
    player_reports: 'Жалобы на игроков',
    mod_reports: 'Жалобы на модерацию',
    appeals: 'Апелляции',
    offtop: 'Оффтоп',
    coords: 'Координаты базы',
    teammate: 'Поиск тимейта',
    builds: 'Постройки'
  };

  const SECTIONS = {
    info: { name: 'Информация для игроков', subforums: ['rules', 'admin', 'banned'] },
    tech: { name: 'Технический раздел', subforums: ['ideas', 'bugs'] },
    complaints: { name: 'Жалобы и апелляции', subforums: ['player_reports', 'mod_reports', 'appeals'] },
    chat: { name: 'Общение', subforums: ['offtop', 'coords', 'teammate', 'builds'] }
  };

  function getSubforumLabel(key) {
    const labels = {
      bugs: '📝 Сообщить о баге',
      player_reports: '⚠️ Подать жалобу',
      mod_reports: '⚠️ Подать жалобу',
      appeals: '📨 Подать апелляцию',
      builds: '+ Поделиться постройкой'
    };
    return labels[key] || '+ Создать тему';
  }

  // === АПИ ===
  async function getTopics(sectionKey, subforumKey) {
    try {
      const res = await fetch(`${API_URL}/forum/topics/${sectionKey}/${subforumKey}`);
      return await res.json();
    } catch(e) {
      console.error('Ошибка загрузки тем:', e);
      return [];
    }
  }

  async function createTopic(sectionKey, subforumKey, title, author, text) {
    try {
      const res = await fetch(`${API_URL}/forum/topics`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sectionKey, subforumKey, title, author, text })
      });
      return await res.json();
    } catch(e) {
      console.error('Ошибка создания темы:', e);
      return { ok: false };
    }
  }

  async function getMessages(topicId) {
    try {
      const res = await fetch(`${API_URL}/forum/messages/${topicId}`);
      return await res.json();
    } catch(e) {
      console.error('Ошибка загрузки сообщений:', e);
      return [];
    }
  }

  async function addMessage(topicId, author, text, time) {
    try {
      const res = await fetch(`${API_URL}/forum/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topicId, author, text, time })
      });
      return await res.json();
    } catch(e) {
      console.error('Ошибка отправки сообщения:', e);
      return { ok: false };
    }
  }

  function hideAllViews() {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('subforumView').style.display = 'none';
    document.getElementById('topicView').style.display = 'none';
  }

  function showSections() {
    hideAllViews();
    document.getElementById('listView').style.display = 'block';
    window.scrollTo(0, 0);
    renderForum();
  }

  async function renderForum() {
    const container = document.getElementById('forumContainer');
    let html = '';

    for (const [sKey, section] of Object.entries(SECTIONS)) {
      const isOpen = localStorage.getItem(`forum_open_${sKey}`) !== 'false';
      html += `
        <div class="forum-section">
          <div class="forum-section-header" data-section="${sKey}">
            <h3>${escapeHtml(section.name)}</h3>
            <span class="toggle-icon ${isOpen ? 'open' : ''}">▼</span>
          </div>
          <div class="forum-section-body ${isOpen ? 'open' : ''}">
            <div class="inner">
              ${section.subforums.map(fKey => {
                const name = SUBFORUM_NAMES[fKey] || fKey;
                return `
                  <div class="subforum-row" data-section="${sKey}" data-subforum="${fKey}">
                    <span class="pip"></span>
                    <div>
                      <div class="name">${escapeHtml(name)}</div>
                    </div>
                    <div>
                      <div class="count" id="count_${sKey}_${fKey}">0</div>
                      <div class="count-label">тем</div>
                    </div>
                    <div>
                      <div class="count" id="msgCount_${sKey}_${fKey}">0</div>
                      <div class="count-label">сообщ.</div>
                    </div>
                    <div class="last-col" id="last_${sKey}_${fKey}">Загрузка...</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }
    container.innerHTML = html;

    for (const [sKey, section] of Object.entries(SECTIONS)) {
      for (const fKey of section.subforums) {
        const topics = await getTopics(sKey, fKey);
        const countEl = document.getElementById(`count_${sKey}_${fKey}`);
        const msgCountEl = document.getElementById(`msgCount_${sKey}_${fKey}`);
        const lastEl = document.getElementById(`last_${sKey}_${fKey}`);
        if (countEl) countEl.textContent = topics.length;
        if (msgCountEl) {
          const totalMsgs = topics.reduce((sum, t) => sum + (t.replies || 0), 0);
          msgCountEl.textContent = totalMsgs;
        }
        if (lastEl) {
          if (topics.length > 0) {
            const last = topics[0];
            lastEl.innerHTML = `<span class="t">${escapeHtml(last.title)}</span>${last.last} · ${escapeHtml(last.author)}`;
          } else {
            lastEl.textContent = 'Нет тем';
          }
        }
      }
    }

    document.querySelectorAll('.forum-section-header').forEach(header => {
      header.addEventListener('click', function() {
        const key = this.dataset.section;
        const body = this.nextElementSibling;
        const icon = this.querySelector('.toggle-icon');
        const isOpen = body.classList.toggle('open');
        icon.classList.toggle('open');
        localStorage.setItem(`forum_open_${key}`, isOpen);
      });
    });

    document.querySelectorAll('.subforum-row').forEach(el => {
      el.addEventListener('click', function() {
        openSubforum(this.dataset.section, this.dataset.subforum);
      });
    });

    renderSidebar();
    renderOnline();
  }

  function allTopicsFlat() {
    const out = [];
    for (const section of Object.values(forumData.sections)) {
      for (const sub of Object.values(section.subforums)) {
        for (const t of sub.topics) out.push(t);
      }
    }
    return out;
  }

  function renderSidebar() {
    const allTopics = allTopicsFlat();
    const rec = allTopics.slice(0, 3);
    document.getElementById('recommendedList').innerHTML = rec.map(t => `
      <div class="side-item" onclick="window.openTopic(${t.id})">
        ${escapeHtml(t.title)}
        <div class="info">${t.last} · Ответов: ${t.replies}</div>
      </div>
    `).join('') || '<div class="dim">Пока нечего показать</div>';

    const sorted = [...allTopics].sort((a, b) => b.replies - a.replies).slice(0, 5);
    document.getElementById('popularList').innerHTML = sorted.map(t => `
      <div class="side-item" onclick="window.openTopic(${t.id})">
        ${escapeHtml(t.title)}
        <div class="info">${t.last} · Ответов: ${t.replies}</div>
      </div>
    `).join('') || '<div class="dim">Пока нечего показать</div>';
  }

  function renderOnline() {
    const onlineUsers = ['tufhj', 'admin'];
    document.getElementById('onlineUsers').innerHTML = onlineUsers.map(u =>
      `<span class="name">${escapeHtml(u)}</span>`
    ).join(', ');
    document.getElementById('onlineTotal').textContent = `Всего: ${onlineUsers.length} пользователей`;
  }

  async function openSubforum(sectionKey, subforumKey) {
    currentSectionKey = sectionKey;
    currentSubforumKey = subforumKey;
    currentPage = 1;

    const topics = await getTopics(sectionKey, subforumKey);
    currentTopics = topics;

    hideAllViews();
    document.getElementById('subforumView').style.display = 'block';
    window.scrollTo(0, 0);

    const sectionName = SECTIONS[sectionKey]?.name || sectionKey;
    const subforumName = SUBFORUM_NAMES[subforumKey] || subforumKey;

    document.getElementById('subforumBreadcrumb').innerHTML = `
      <a id="crumbForumFromSub">Форумы</a>
      <span class="sep">›</span>
      <span class="current">${escapeHtml(sectionName)}</span>
      <span class="sep">›</span>
      <span class="current">${escapeHtml(subforumName)}</span>
    `;

    document.getElementById('subforumTitleEl').textContent = subforumName;

    const createBtn = document.getElementById('subforumCreateBtn');
    createBtn.textContent = getSubforumLabel(subforumKey);
    createBtn.onclick = () => openCreateForm(sectionKey, subforumKey);

    document.getElementById('crumbForumFromSub').addEventListener('click', showSections);
    document.getElementById('backFromSubforum').addEventListener('click', showSections);

    renderTopicsWithPagination(topics, 1);
  }

  function getFilteredTopics(topics, filter) {
    const user = Auth.currentUser();
    const username = user ? user.username : '';
    switch(filter) {
      case 'my':
        return topics.filter(t => t.author === username);
      case 'no-replies':
        return topics.filter(t => t.replies === 0);
      default:
        return topics;
    }
  }

  function renderTopicsWithPagination(topics, page) {
    const filtered = getFilteredTopics(topics, currentFilter);
    const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
    if (page > totalPages) page = totalPages;
    if (page < 1) page = 1;
    currentPage = page;

    const start = (page - 1) * ITEMS_PER_PAGE;
    const end = start + ITEMS_PER_PAGE;
    const pageTopics = filtered.slice(start, end);

    document.getElementById('filterAllCount').textContent = topics.length;
    document.getElementById('filterMyCount').textContent = topics.filter(t => t.author === (Auth.currentUser() ? Auth.currentUser().username : '')).length;
    document.getElementById('filterNoRepliesCount').textContent = topics.filter(t => t.replies === 0).length;

    const container = document.getElementById('subforumTopicsList');
    if (pageTopics.length === 0) {
      container.innerHTML = '<div class="empty-row">Нет тем</div>';
    } else {
      container.innerHTML = pageTopics.map(t => `
        <div class="topic-list-row" data-topic="${t.id}">
          <div class="main-col">
            <span class="t-title">${escapeHtml(t.title)}</span>
            <div class="t-meta">Автор: ${escapeHtml(t.author)} · ${t.last}</div>
          </div>
          <div class="num-col"><b>${t.replies}</b>ответы</div>
          <div class="num-col"><b>${t.views || 0}</b>просм.</div>
          <div class="date-col">${t.last}<span class="who">${escapeHtml(t.author)}</span></div>
        </div>
      `).join('');
    }

    const pagination = document.getElementById('pagination');
    let pagHtml = '';
    pagHtml += `<button class="page-btn ${page <= 1 ? 'disabled' : ''}" data-page="${page - 1}">‹</button>`;
    
    const maxVisible = 5;
    let startPage = Math.max(1, page - Math.floor(maxVisible / 2));
    let endPage = Math.min(totalPages, startPage + maxVisible - 1);
    if (endPage - startPage < maxVisible - 1) startPage = Math.max(1, endPage - maxVisible + 1);
    
    if (startPage > 1) pagHtml += `<button class="page-btn" data-page="1">1</button>${startPage > 2 ? '<span class="page-btn" style="background:transparent;border:none;cursor:default;">…</span>' : ''}`;
    
    for (let i = startPage; i <= endPage; i++) {
      pagHtml += `<button class="page-btn ${i === page ? 'active' : ''}" data-page="${i}">${i}</button>`;
    }
    
    if (endPage < totalPages) pagHtml += `${endPage < totalPages - 1 ? '<span class="page-btn" style="background:transparent;border:none;cursor:default;">…</span>' : ''}<button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
    
    pagHtml += `<button class="page-btn ${page >= totalPages ? 'disabled' : ''}" data-page="${page + 1}">›</button>`;
    pagHtml += `<span class="page-info">${page} / ${totalPages}</span>`;
    pagination.innerHTML = pagHtml;

    pagination.querySelectorAll('.page-btn:not(.disabled)').forEach(btn => {
      btn.addEventListener('click', function() {
        const newPage = parseInt(this.dataset.page);
        if (newPage && newPage >= 1 && newPage <= totalPages) {
          renderTopicsWithPagination(topics, newPage);
        }
      });
    });

    container.querySelectorAll('.topic-list-row').forEach(el => {
      el.addEventListener('click', function() {
        openTopic(parseInt(this.dataset.topic));
      });
    });
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      renderTopicsWithPagination(currentTopics, 1);
    });
  });

  function openCreateForm(sectionKey, subforumKey) {
    const modal = document.getElementById('topicModal');
    const content = document.getElementById('modalContent');
    const found = forumData.sections[sectionKey]?.subforums[subforumKey];
    const fields = found?.fields || null;

    if (fields) {
      content.innerHTML = `
        <h2 style="margin-bottom:16px;font-size:17px;">${escapeHtml(found.createLabel.replace(/^\W+\s*/, ''))}</h2>
        <form id="customTopicForm">
          ${fields.map((f, i) => `
            <div class="field">
              <label for="cf_${i}">${escapeHtml(f.label)}</label>
              <textarea id="cf_${i}" required style="min-height:44px;"></textarea>
            </div>
          `).join('')}
          <button type="submit" class="btn primary block">${escapeHtml(found.createLabel)}</button>
          <div class="form-msg" id="topicMsg"></div>
        </form>
      `;
      modal.classList.add('active');

      const composer = attachComposer(document.getElementById('cf_0'));

      document.getElementById('customTopicForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const msgEl = document.getElementById('topicMsg');
        const values = fields.map((f, i) => document.getElementById('cf_' + i).value.trim());
        if (values.some(v => !v)) {
          msgEl.className = 'form-msg err';
          msgEl.textContent = 'Заполните все поля.';
          return;
        }
        const user = Auth.currentUser();
        const author = user ? user.username : 'Гость';
        const now = new Date().toLocaleDateString('ru-RU');
        const body = fields.map((f, i) => `${f.label}: ${values[i]}`).join('\n');
        const title = `${found.name.slice(0, -1)} от ${author}`;

        const result = await createTopic(sectionKey, subforumKey, title, author, body);
        if (result.ok) {
          msgEl.className = 'form-msg ok';
          msgEl.textContent = 'Отправлено!';
          setTimeout(() => {
            modal.classList.remove('active');
            openSubforum(sectionKey, subforumKey);
          }, 500);
        } else {
          msgEl.className = 'form-msg err';
          msgEl.textContent = 'Ошибка создания темы';
        }
      });
      return;
    }

    content.innerHTML = `
      <h2 style="margin-bottom:16px;font-size:17px;">Создать тему</h2>
      <form id="newTopicForm">
        <div class="field">
          <label for="topicTitle">Заголовок</label>
          <input type="text" id="topicTitle" required maxlength="80" placeholder="Название темы">
        </div>
        <div class="field">
          <label for="topicText">Текст</label>
          <textarea id="topicText" required maxlength="600" placeholder="Что вы хотите сказать?"></textarea>
        </div>
        <button type="submit" class="btn primary block">Опубликовать</button>
        <div class="form-msg" id="topicMsg"></div>
      </form>
    `;
    modal.classList.add('active');

    const composer = attachComposer(document.getElementById('topicText'));

    document.getElementById('newTopicForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const title = document.getElementById('topicTitle').value.trim();
      const text = document.getElementById('topicText').value.trim();
      const msgEl = document.getElementById('topicMsg');

      if (!title || !text) {
        msgEl.className = 'form-msg err';
        msgEl.textContent = 'Заполните все поля.';
        return;
      }

      const user = Auth.currentUser();
      const author = user ? user.username : 'Гость';

      const result = await createTopic(sectionKey, subforumKey, title, author, text);
      if (result.ok) {
        msgEl.className = 'form-msg ok';
        msgEl.textContent = 'Тема создана!';
        setTimeout(() => {
          modal.classList.remove('active');
          openSubforum(sectionKey, subforumKey);
        }, 500);
      } else {
        msgEl.className = 'form-msg err';
        msgEl.textContent = 'Ошибка создания темы';
      }
    });
  }

  function attachComposer(textarea) {
    const toolbar = document.createElement('div');
    toolbar.className = 'composer-toolbar';
    toolbar.innerHTML = `
      <button type="button" class="btn-attach">📎 Прикрепить фото</button>
      <input type="file" accept="image/*" class="composer-attach-input">
    `;
    textarea.insertAdjacentElement('afterend', toolbar);
    const previewWrap = document.createElement('div');
    toolbar.insertAdjacentElement('afterend', previewWrap);

    let attachedImage = null;
    const attachBtn = toolbar.querySelector('.btn-attach');
    const fileInput = toolbar.querySelector('.composer-attach-input');

    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { toast('Можно прикреплять только изображения'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        attachedImage = reader.result;
        previewWrap.innerHTML = `
          <div class="composer-image-preview">
            <img src="${attachedImage}">
            <button type="button" class="remove-img">×</button>
          </div>
        `;
        previewWrap.querySelector('.remove-img').addEventListener('click', () => {
          attachedImage = null;
          previewWrap.innerHTML = '';
          fileInput.value = '';
        });
      };
      reader.readAsDataURL(file);
    });

    return {
      getImage: () => attachedImage,
      clear: () => { attachedImage = null; previewWrap.innerHTML = ''; fileInput.value = ''; }
    };
  }

  function computeMessageCount(username) {
    let count = 0;
    for (const arr of Object.values(forumData.messages)) {
      count += arr.filter(m => m.author === username).length;
    }
    return count;
  }

  window.openProfileCard = function(username, event) {
    if (!event) return;
    event.stopPropagation();
    const card = document.getElementById('profileCard');
    const avatar = getUserAvatar(username);
    const color = avatarColor(username);
    const msgCount = computeMessageCount(username);

    card.innerHTML = `
      <div class="profile-card-head">
        <div class="profile-card-avatar" style="background:${color};">
          ${avatar ? `<img src="${avatar}">` : escapeHtml(username.slice(0,1).toUpperCase())}
        </div>
        <div>
          <div class="profile-card-name">${escapeHtml(username)}</div>
          <div class="profile-card-status online">сейчас онлайн</div>
        </div>
        <button class="profile-card-more" id="profileMoreBtn">⋯</button>
        <div class="profile-dropdown" id="profileDropdown">
          <div class="label">Дополнительно</div>
          <div class="item" data-action="report">Пожаловаться</div>
          <div class="item" data-action="find-messages">Найти сообщения</div>
        </div>
      </div>
      <div class="profile-card-role">Игрок</div>
      <div class="profile-card-stats">
        <div><b>${msgCount}</b><span>Сообщ.</span></div>
        <div><b>0</b><span>Подписч.</span></div>
        <div><b>0</b><span>Реакции</span></div>
        <div><b>0</b><span>Награды</span></div>
      </div>
      <div class="profile-card-actions">
        <button class="btn small" id="profSubBtn">Подписаться</button>
        <button class="btn small" id="profIgnBtn">+ Игнор</button>
        <button class="btn primary small" id="profMsgBtn">Написать</button>
      </div>
    `;

    const rect = event.currentTarget.getBoundingClientRect();
    let top = rect.bottom + 8;
    let left = rect.left;
    const cardWidth = 300;
    if (left + cardWidth > window.innerWidth - 12) left = window.innerWidth - cardWidth - 12;
    if (left < 12) left = 12;
    if (top + 300 > window.innerHeight) top = Math.max(12, rect.top - 300);
    card.style.top = top + 'px';
    card.style.left = left + 'px';
    card.classList.add('active');

    document.getElementById('profileMoreBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('profileDropdown').classList.toggle('active');
    });

    card.querySelectorAll('.profile-dropdown .item').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        card.classList.remove('active');
        if (item.dataset.action === 'report') {
          toast('Жалоба отправлена');
        } else {
          toast('Функция в разработке');
        }
      });
    });

    document.getElementById('profSubBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      toast(`Вы подписались на ${username}`);
    });
    document.getElementById('profIgnBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      toast(`${username} добавлен в игнор`);
    });
    document.getElementById('profMsgBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      toast('Личные сообщения пока не подключены');
    });

    setTimeout(() => {
      document.addEventListener('click', function handler(ev) {
        if (!card.contains(ev.target)) {
          card.classList.remove('active');
          document.removeEventListener('click', handler);
        }
      });
    }, 0);
  };

  function renderReplyBlock(topicId) {
    const user = Auth.currentUser();
    const block = document.getElementById('replyBlock');
    if (!user) {
      block.innerHTML = `
        <div class="guest-lock">
          Только авторизованные пользователи могут отвечать в теме.
          <div style="margin-top:12px;"><a href="auth.html" class="btn primary small">Войдите, чтобы ответить</a></div>
        </div>
      `;
      return;
    }

    const avatar = getUserAvatar(user.username);
    const color = avatarColor(user.username);

    block.innerHTML = `
      <div class="reply-area">
        <div class="editor-wrap">
          <div class="editor-avatar" style="background:${color};${avatar ? `background-image:url('${avatar}');background-size:cover;background-position:center;` : ''}">
            ${avatar ? '' : escapeHtml(user.username.slice(0,1).toUpperCase())}
          </div>
          <div class="editor-box">
            <div class="editor-toolbar">
              <button type="button" data-cmd="bold" title="Жирный"><b>Ж</b></button>
              <button type="button" data-cmd="italic" title="Курсив"><i>К</i></button>
              <button type="button" data-cmd="underline" title="Подчёркнутый"><u>Ч</u></button>
              <span class="tb-sep"></span>
              <button type="button" data-cmd="insertUnorderedList" title="Список">☰</button>
              <button type="button" data-cmd="insertOrderedList" title="Нумерованный">▤</button>
              <span class="tb-sep"></span>
              <button type="button" data-cmd="justifyLeft" title="Влево">◧</button>
              <button type="button" data-cmd="justifyCenter" title="По центру">◫</button>
              <button type="button" data-cmd="justifyRight" title="Вправо">◨</button>
              <span class="tb-sep"></span>
              <button type="button" data-cmd="link" title="Ссылка">🔗</button>
              <button type="button" data-cmd="quote" title="Цитата">❝</button>
              <span class="tb-sep"></span>
              <button type="button" data-cmd="image" title="Фото">🖼️</button>
            </div>
            <div class="editor-content" id="replyEditor" contenteditable="true" data-placeholder="Напишите свой ответ…"></div>
            <input type="file" accept="image/*" id="replyFileInput" multiple style="display:none;">
          </div>
        </div>
        <div class="editor-actions">
          <button type="button" class="btn" id="attachFilesBtn">📎 Прикрепить файлы</button>
          <button type="button" class="btn primary" id="replyBtn">↩ Ответить</button>
        </div>
        <div class="form-msg" id="replyMsg"></div>
      </div>
    `;

    const editor = document.getElementById('replyEditor');
    const fileInput = document.getElementById('replyFileInput');

    function insertImagesFromFiles(files) {
      Array.from(files).forEach(file => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = () => {
          editor.focus();
          document.execCommand('insertImage', false, reader.result);
        };
        reader.readAsDataURL(file);
      });
    }

    document.querySelectorAll('#replyBlock .editor-toolbar button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        editor.focus();
        const cmd = btn.dataset.cmd;
        if (cmd === 'link') {
          const url = prompt('Вставьте ссылку:');
          if (url) document.execCommand('createLink', false, url);
        } else if (cmd === 'quote') {
          document.execCommand('formatBlock', false, 'blockquote');
        } else if (cmd === 'image') {
          fileInput.click();
        } else {
          document.execCommand(cmd, false, null);
        }
      });
    });

    document.getElementById('attachFilesBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => { insertImagesFromFiles(fileInput.files); fileInput.value = ''; });

    document.getElementById('replyBtn').addEventListener('click', async function() {
      const html = sanitizeHtml(editor.innerHTML.trim());
      const plain = editor.textContent.trim();
      const replyMsg = document.getElementById('replyMsg');
      if (!plain && !/<img/i.test(html)) {
        replyMsg.className = 'form-msg err';
        replyMsg.textContent = 'Напишите текст или прикрепите фото.';
        return;
      }

      const now = new Date().toLocaleDateString('ru-RU') + ' ' + new Date().toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
      const result = await addMessage(topicId, user.username, html || plain, now);
      if (result.ok) {
        openTopic(topicId);
      } else {
        replyMsg.className = 'form-msg err';
        replyMsg.textContent = 'Ошибка отправки';
      }
    });
  }

  window.openTopic = async function(topicId) {
    const messages = await getMessages(topicId);
    if (messages.length === 0) {
      toast('Тема не найдена');
      return;
    }

    const topic = currentTopics.find(t => t.id === topicId);
    if (!topic) return;

    hideAllViews();
    document.getElementById('topicView').style.display = 'block';
    window.scrollTo(0, 0);

    const sectionName = SECTIONS[currentSectionKey]?.name || currentSectionKey;
    const subforumName = SUBFORUM_NAMES[currentSubforumKey] || currentSubforumKey;

    document.getElementById('topicBreadcrumb').innerHTML = `
      <a id="crumbForum">Форумы</a>
      <span class="sep">›</span>
      <a id="crumbSection">${escapeHtml(sectionName)}</a>
      <span class="sep">›</span>
      <a id="crumbSubforum">${escapeHtml(subforumName)}</a>
      <span class="sep">›</span>
      <span class="current">${escapeHtml(topic.title)}</span>
    `;

    document.getElementById('topicTitleEl').textContent = topic.title;
    document.getElementById('topicInfoEl').innerHTML = `
      <span>Автор: <b>${escapeHtml(topic.author)}</b></span>
      <span>${topic.last}</span>
      <span>${topic.views || 0} просмотров</span>
      <span>${topic.replies} ответов</span>
    `;

    document.getElementById('postsList').innerHTML = messages.map((msg, i) => {
      const author = msg.author || 'Гость';
      const avatar = getUserAvatar(author);
      const color = avatarColor(author);
      const isHtml = msg.text && msg.text.includes('<');
      return `
        <div class="post-item">
          <div class="post-side">
            <div class="post-avatar" data-author="${escapeHtml(author)}" style="background:${color};${avatar ? `background-image:url('${avatar}');background-size:cover;background-position:center;` : ''}">
              ${avatar ? '' : escapeHtml(author.slice(0,1).toUpperCase())}
            </div>
            <div class="post-author" data-author="${escapeHtml(author)}">${escapeHtml(author)}</div>
            <div class="post-num">#${i + 1}</div>
          </div>
          <div class="post-body">
            <div class="post-time">${escapeHtml(msg.time || 'недавно')}</div>
            ${isHtml ? `<div class="post-text rich">${msg.text}</div>` : `<div class="post-text">${escapeHtml(msg.text)}</div>`}
          </div>
        </div>
      `;
    }).join('');

    document.querySelectorAll('[data-author]').forEach(el => {
      el.addEventListener('click', function(e) {
        openProfileCard(this.dataset.author, e);
      });
    });

    renderReplyBlock(topicId);

    document.getElementById('backFromTopic').addEventListener('click', () => {
      openSubforum(currentSectionKey, currentSubforumKey);
    });
    document.getElementById('backToMainFromTopic').addEventListener('click', showSections);

    document.getElementById('crumbForum').addEventListener('click', showSections);
    document.getElementById('crumbSection').addEventListener('click', showSections);
    document.getElementById('crumbSubforum').addEventListener('click', () => openSubforum(currentSectionKey, currentSubforumKey));
  };

  document.getElementById('closeModalBtn').addEventListener('click', () => {
    document.getElementById('topicModal').classList.remove('active');
  });
  document.getElementById('topicModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) document.getElementById('topicModal').classList.remove('active');
  });

  window.Auth = Auth;
  window.openTopic = openTopic;
  window.openSubforum = openSubforum;

  showSections();
  })();
</script>
</body>
</html>
