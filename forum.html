<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Форум — REALLYANARCHY</title>
<link rel="stylesheet" href="style.css">
<style>
  .forum-section {
    margin-bottom: 20px;
  }
  .forum-section-header {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  .forum-section-header:hover {
    background: var(--bg-raised);
  }
  .forum-section-header h3 {
    font-size: 14px;
    color: var(--lime);
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .forum-section-header .toggle-icon {
    color: var(--text-dim);
    font-size: 14px;
    transition: transform 0.3s;
  }
  .forum-section-header .toggle-icon.open {
    transform: rotate(180deg);
  }
  .forum-section-body {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.3s ease;
    max-height: 0;
    padding: 0 18px;
  }
  .forum-section-body.open {
    max-height: 5000px;
    padding: 12px 18px;
  }
  .forum-category {
    padding: 10px 12px;
    margin-bottom: 4px;
    border-radius: var(--radius);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .forum-category:hover {
    background: rgba(247, 183, 51, 0.06);
  }
  .forum-category .name {
    color: var(--text);
    font-weight: 500;
    font-size: 14px;
  }
  .forum-category .name:hover {
    color: var(--lime);
  }
  .forum-category .meta {
    color: var(--text-dim);
    font-size: 12px;
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .forum-category .meta .replies {
    color: var(--lime);
    font-weight: 700;
  }

  /* МОДАЛЬНОЕ ОКНО ТЕМЫ */
  .topic-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .topic-modal.active {
    display: flex;
  }
  .topic-modal-content {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    max-width: 640px;
    width: 94%;
    max-height: 92vh;
    overflow-y: auto;
  }
  .topic-modal-content .close-modal {
    float: right;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 26px;
    cursor: pointer;
    line-height: 1;
  }
  .topic-modal-content .close-modal:hover {
    color: var(--text);
  }
  .topic-modal-content .topic-header {
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-lo);
  }
  .topic-modal-content .topic-header h2 {
    font-size: 18px;
    margin: 0 0 4px 0;
    color: var(--text);
  }
  .topic-modal-content .topic-header .info {
    color: var(--text-dim);
    font-size: 12px;
  }
  .topic-modal-content .topic-header .info span {
    margin-right: 12px;
  }

  .messages-list {
    max-height: 350px;
    overflow-y: auto;
    margin: 12px 0;
    padding: 0 4px;
  }
  .message-item {
    padding: 10px 14px;
    margin-bottom: 8px;
    background: #111211;
    border-radius: var(--radius);
    border: 1px solid var(--border-lo);
  }
  .message-item .author {
    color: var(--lime);
    font-weight: 700;
    font-size: 13px;
  }
  .message-item .time {
    color: var(--text-dim);
    font-size: 11px;
    margin-left: 8px;
  }
  .message-item .text {
    color: var(--text);
    margin-top: 4px;
    font-size: 14px;
    word-wrap: break-word;
  }

  .reply-area {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border-lo);
  }
  .reply-area textarea {
    width: 100%;
    background: #111211;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 12px;
    min-height: 70px;
    resize: vertical;
  }
  .reply-area .btn {
    margin-top: 8px;
  }

  .forum-actions {
    margin-top: 20px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* БОКОВАЯ ПАНЕЛЬ */
  .forum-sidebar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 20px;
  }
  .forum-sidebar .side-box {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .forum-sidebar .side-box h4 {
    font-size: 12px;
    color: var(--lime);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 10px 0;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-lo);
  }
  .forum-sidebar .side-item {
    padding: 4px 0;
    font-size: 13px;
    cursor: pointer;
  }
  .forum-sidebar .side-item:hover {
    color: var(--lime);
  }
  .forum-sidebar .side-item .info {
    color: var(--text-dim);
    font-size: 11px;
  }

  .online-box {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-top: 16px;
  }
  .online-box h4 {
    font-size: 12px;
    color: var(--lime);
    text-transform: uppercase;
    margin: 0 0 8px 0;
  }
  .online-box .users {
    color: var(--text);
    font-size: 13px;
  }
  .online-box .users .name {
    color: var(--lime);
  }
  .online-box .total {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 4px;
  }

  .social-links {
    display: flex;
    gap: 12px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .social-links a {
    color: var(--text-dim);
    font-size: 13px;
    text-decoration: none;
  }
  .social-links a:hover {
    color: var(--lime);
  }

  @media (max-width: 720px) {
    .forum-sidebar {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<div id="nav-root"></div>

<main>
  <section>
    <div class="wrap">
      <div class="section-head">
        <h1>Форум</h1>
        <p class="dim">Общайся, задавай вопросы, делись опытом</p>
      </div>

      <div id="forumContainer"></div>

      <div class="forum-actions">
        <button class="btn primary" id="newTopicBtn">+ Создать тему</button>
      </div>

      <div class="forum-sidebar">
        <div class="side-box">
          <h4>⭐ Рекомендуемое</h4>
          <div id="recommendedList"></div>
        </div>
        <div class="side-box">
          <h4>🔥 Популярное</h4>
          <div id="popularList"></div>
        </div>
      </div>

      <div class="online-box">
        <h4>👥 Пользователи онлайн</h4>
        <div class="users" id="onlineUsers"></div>
        <div class="total" id="onlineTotal"></div>
      </div>

      <div class="online-box" style="margin-top:8px;">
        <h4>📱 Наши соцсети</h4>
        <div class="social-links">
          <a href="#" target="_blank">Telegram</a>
          <a href="#" target="_blank">Discord</a>
          <a href="#" target="_blank">VK</a>
        </div>
      </div>

      <!-- МОДАЛЬНОЕ ОКНО -->
      <div class="topic-modal" id="topicModal">
        <div class="topic-modal-content">
          <button class="close-modal" id="closeModalBtn">&times;</button>
          <div id="modalContent">
            <!-- Содержимое подгружается динамически -->
          </div>
        </div>
      </div>

    </div>
  </section>
</main>

<div id="footer-root"></div>

<script src="db.js"></script>
<script src="nav.js"></script>
<script>
  renderNav('forum.html');
  renderFooter();

  // === КЛЮЧ ДЛЯ БД ===
  const FORUM_KEY = 'ra_forum_v3';

  // === ДАННЫЕ ПО УМОЛЧАНИЮ ===
  function getDefaultForum() {
    return {
      categories: {
        info: {
          name: 'Информация для игроков',
          open: true,
          topics: [
            { id: 1, title: 'Правила проекта', author: 'admin', replies: 2, last: '12.06.2026', views: 45 },
            { id: 2, title: 'Администрация проекта', author: 'admin', replies: 1, last: '11.06.2026', views: 30 },
            { id: 3, title: 'Список запрещённых модификаций', author: 'admin', replies: 2, last: '10.06.2026', views: 28 }
          ]
        },
        tech: {
          name: 'Технический раздел',
          open: true,
          topics: [
            { id: 4, title: 'Ваши идеи и предложения', author: 'admin', replies: 54, last: '09.06.2026', views: 129 },
            { id: 5, title: 'Баги', author: 'admin', replies: 33, last: '08.06.2026', views: 71 }
          ]
        },
        complaints: {
          name: 'Жалобы и апелляции',
          open: true,
          topics: [
            { id: 6, title: 'Жалобы на игроков', author: 'admin', replies: 119, last: '07.06.2026', views: 364 },
            { id: 7, title: 'Жалобы на модерацию', author: 'admin', replies: 35, last: '06.06.2026', views: 125 },
            { id: 8, title: 'Апелляции', author: 'admin', replies: 287, last: '05.06.2026', views: 956 }
          ]
        },
        chat: {
          name: 'Общение',
          open: true,
          topics: [
            { id: 9, title: 'Оффтоп', author: 'admin', replies: 10, last: '04.06.2026', views: 4 },
            { id: 10, title: 'Координаты базы', author: 'admin', replies: 3, last: '03.06.2026', views: 1 },
            { id: 11, title: 'Поиск тимейта', author: 'admin', replies: 3, last: '02.06.2026', views: 1 },
            { id: 12, title: 'Постройки', author: 'admin', replies: 14, last: '01.06.2026', views: 4 }
          ]
        }
      },
      messages: {
        1: [{ author: 'admin', text: 'Добро пожаловать на сервер! Ознакомьтесь с правилами.', time: '12.06.2026' }],
        2: [{ author: 'admin', text: 'Состав администрации проекта.', time: '11.06.2026' }],
        3: [{ author: 'admin', text: 'Список запрещённых модов обновлён.', time: '10.06.2026' }],
        6: [{ author: 'admin', text: 'Жалоба на игрока X рассматривается.', time: '07.06.2026' }],
        8: [{ author: 'admin', text: 'Апелляция — To4no_Ne_Golem', time: '05.06.2026' }]
      },
      online: ['mechanizator', 'artist', 'CloudLink', 'tufhj']
    };
  }

  function getForumData() {
    const raw = localStorage.getItem(FORUM_KEY);
    if (raw) {
      try {
        const data = JSON.parse(raw);
        // Проверяем, что все категории есть
        const defaultData = getDefaultForum();
        for (const key of Object.keys(defaultData.categories)) {
          if (!data.categories[key]) {
            data.categories[key] = defaultData.categories[key];
          }
        }
        return data;
      } catch(e) {}
    }
    const defaultData = getDefaultForum();
    localStorage.setItem(FORUM_KEY, JSON.stringify(defaultData));
    return defaultData;
  }

  function saveForumData(data) {
    localStorage.setItem(FORUM_KEY, JSON.stringify(data));
  }

  let forumData = getForumData();

  // === ОТОБРАЖЕНИЕ ФОРУМА ===
  function renderForum() {
    const container = document.getElementById('forumContainer');
    let html = '';

    for (const [key, cat] of Object.entries(forumData.categories)) {
      const isOpen = cat.open !== false;
      html += `
        <div class="forum-section">
          <div class="forum-section-header" data-category="${key}">
            <h3>${escapeHtml(cat.name)}</h3>
            <span class="toggle-icon ${isOpen ? 'open' : ''}">▼</span>
          </div>
          <div class="forum-section-body ${isOpen ? 'open' : ''}">
            ${cat.topics.length === 0 ? '<div class="dim" style="padding:12px;text-align:center;">Нет тем</div>' : ''}
            ${cat.topics.map(t => `
              <div class="forum-category" data-topic="${t.id}">
                <span class="name">${escapeHtml(t.title)}</span>
                <div class="meta">
                  <span>Автор: ${escapeHtml(t.author)}</span>
                  <span class="replies">${t.replies} ответов</span>
                  <span style="font-size:11px;">${t.last}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }
    container.innerHTML = html;

    // === СОБЫТИЯ ===
    // Переключение разделов
    document.querySelectorAll('.forum-section-header').forEach(header => {
      header.addEventListener('click', function() {
        const key = this.dataset.category;
        const body = this.nextElementSibling;
        const icon = this.querySelector('.toggle-icon');
        const isOpen = body.classList.toggle('open');
        icon.classList.toggle('open');
        forumData.categories[key].open = isOpen;
        saveForumData(forumData);
      });
    });

    // Открытие темы
    document.querySelectorAll('.forum-category').forEach(el => {
      el.addEventListener('click', function() {
        const topicId = parseInt(this.dataset.topic);
        openTopic(topicId);
      });
    });

    renderSidebar();
    renderOnline();
  }

  // === БОКОВАЯ ПАНЕЛЬ ===
  function renderSidebar() {
    const allTopics = Object.values(forumData.categories).flatMap(c => c.topics);
    
    // Рекомендуемые (первые 3 из info)
    const recTopics = forumData.categories.info.topics.slice(0, 3);
    document.getElementById('recommendedList').innerHTML = recTopics.map(t => `
      <div class="side-item" onclick="openTopic(${t.id})">
        ${escapeHtml(t.title)}
        <div class="info">${t.last} • Ответов: ${t.replies}</div>
      </div>
    `).join('') || '<div class="dim">Нет тем</div>';

    // Популярные (по количеству ответов)
    const sorted = [...allTopics].sort((a, b) => b.replies - a.replies).slice(0, 5);
    document.getElementById('popularList').innerHTML = sorted.map(t => `
      <div class="side-item" onclick="openTopic(${t.id})">
        ${escapeHtml(t.title)}
        <div class="info">${t.last} • Ответов: ${t.replies}</div>
      </div>
    `).join('') || '<div class="dim">Нет тем</div>';
  }

  // === ОНЛАЙН ===
  function renderOnline() {
    const users = forumData.online || ['tufhj'];
    document.getElementById('onlineUsers').innerHTML = users.map(u => 
      `<span class="name">${escapeHtml(u)}</span>`
    ).join(', ');
    document.getElementById('onlineTotal').textContent = 
      `Всего: ${users.length + Math.floor(Math.random() * 30) + 10} пользователей, ${Math.floor(Math.random() * 20) + 5} гостей`;
  }

  // === ОТКРЫТИЕ ТЕМЫ ===
  window.openTopic = function(topicId) {
    // Находим тему
    let foundTopic = null;
    let foundCategory = null;
    for (const [key, cat] of Object.entries(forumData.categories)) {
      const t = cat.topics.find(t => t.id === topicId);
      if (t) {
        foundTopic = t;
        foundCategory = key;
        break;
      }
    }
    if (!foundTopic) return;

    // Увеличиваем просмотры
    foundTopic.views = (foundTopic.views || 0) + 1;
    saveForumData(forumData);

    const messages = forumData.messages[topicId] || [];
    const modal = document.getElementById('topicModal');
    const content = document.getElementById('modalContent');

    content.innerHTML = `
      <div class="topic-header">
        <h2>${escapeHtml(foundTopic.title)}</h2>
        <div class="info">
          <span>👤 ${escapeHtml(foundTopic.author)}</span>
          <span>📅 ${foundTopic.last}</span>
          <span>👁️ ${foundTopic.views || 0} просмотров</span>
          <span>💬 ${foundTopic.replies} ответов</span>
        </div>
      </div>

      <div class="messages-list">
        ${messages.length === 0 ? '<div class="dim" style="padding:12px;text-align:center;">Нет сообщений</div>' : ''}
        ${messages.map(msg => `
          <div class="message-item">
            <span class="author">${escapeHtml(msg.author || 'Гость')}</span>
            <span class="time">${msg.time || 'недавно'}</span>
            <div class="text">${escapeHtml(msg.text)}</div>
          </div>
        `).join('')}
      </div>

      <div class="reply-area">
        <textarea id="replyText" placeholder="Напишите ответ..."></textarea>
        <button class="btn primary" id="replyBtn">Ответить</button>
        <div class="form-msg" id="replyMsg"></div>
      </div>
    `;

    modal.classList.add('active');

    // Обработчик ответа
    document.getElementById('replyBtn').addEventListener('click', function() {
      const replyText = document.getElementById('replyText').value.trim();
      const replyMsg = document.getElementById('replyMsg');
      if (!replyText) {
        replyMsg.className = 'form-msg err';
        replyMsg.textContent = 'Напишите текст ответа.';
        return;
      }
      const user = Auth.currentUser();
      const author = user ? user.username : 'Гость';
      const now = new Date().toLocaleDateString('ru-RU') + ' ' + new Date().toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});

      if (!forumData.messages[topicId]) forumData.messages[topicId] = [];
      forumData.messages[topicId].push({ author, text: replyText, time: now });
      foundTopic.replies = (foundTopic.replies || 0) + 1;
      foundTopic.last = new Date().toLocaleDateString('ru-RU');
      saveForumData(forumData);

      replyMsg.className = 'form-msg ok';
      replyMsg.textContent = 'Ответ отправлен!';
      document.getElementById('replyText').value = '';

      setTimeout(() => {
        openTopic(topicId);
        renderForum();
      }, 400);
    });
  };

  // === СОЗДАНИЕ ТЕМЫ ===
  document.getElementById('newTopicBtn').addEventListener('click', () => {
    const modal = document.getElementById('topicModal');
    const content = document.getElementById('modalContent');

    content.innerHTML = `
      <h2 style="margin-bottom:16px;">Создать тему</h2>
      <form id="newTopicForm">
        <div class="field">
          <label for="topicCategory">Раздел</label>
          <select id="topicCategory" required>
            ${Object.entries(forumData.categories).map(([key, cat]) => 
              `<option value="${key}">${escapeHtml(cat.name)}</option>`
            ).join('')}
          </select>
        </div>
        <div class="field">
          <label for="topicTitle">Заголовок</label>
          <input type="text" id="topicTitle" required maxlength="80" placeholder="Название темы">
        </div>
        <div class="field">
          <label for="topicText">Текст</label>
          <textarea id="topicText" required maxlength="600" placeholder="Что вы хотите сказать?"></textarea>
        </div>
        <button type="submit" class="btn primary block">Опубликовать</button>
        <div class="form-msg" id="topicMsg"></div>
      </form>
    `;

    modal.classList.add('active');

    document.getElementById('newTopicForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const category = document.getElementById('topicCategory').value;
      const title = document.getElementById('topicTitle').value.trim();
      const text = document.getElementById('topicText').value.trim();
      const msgEl = document.getElementById('topicMsg');

      if (!title || !text) {
        msgEl.className = 'form-msg err';
        msgEl.textContent = 'Заполните все поля.';
        return;
      }

      const user = Auth.currentUser();
      const author = user ? user.username : 'Гость';
      const now = new Date().toLocaleDateString('ru-RU');

      const newTopic = {
        id: Date.now(),
        title: title,
        author: author,
        replies: 0,
        last: now,
        views: 0
      };

      forumData.categories[category].topics.push(newTopic);
      forumData.messages[newTopic.id] = [{ author, text, time: now }];
      saveForumData(forumData);

      msgEl.className = 'form-msg ok';
      msgEl.textContent = 'Тема создана!';
      document.getElementById('topicTitle').value = '';
      document.getElementById('topicText').value = '';

      setTimeout(() => {
        document.getElementById('topicModal').classList.remove('active');
        renderForum();
      }, 600);
    });
  });

  // === ЗАКРЫТИЕ МОДАЛЬНОГО ОКНА ===
  document.getElementById('closeModalBtn').addEventListener('click', () => {
    document.getElementById('topicModal').classList.remove('active');
  });

  document.getElementById('topicModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) {
      document.getElementById('topicModal').classList.remove('active');
    }
  });

  // === ЗАПУСК ===
  renderForum();
</script>
</body>
</html>
