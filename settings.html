<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Настройки — REALLYANARCHY</title>
<link rel="stylesheet" href="style.css">
<style>
  .settings-container {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 24px;
    margin-top: 20px;
  }
  .settings-sidebar {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 0;
  }
  .settings-sidebar a {
    display: block;
    padding: 10px 18px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    border-left: 3px solid transparent;
    transition: all 0.15s;
  }
  .settings-sidebar a:hover {
    color: var(--text);
    background: rgba(247,183,51,0.05);
  }
  .settings-sidebar a.active {
    color: var(--lime);
    border-left-color: var(--lime);
    background: rgba(247,183,51,0.08);
  }
  .settings-content {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .settings-content h2 {
    font-family: var(--font-display);
    font-size: 16px;
    color: var(--lime);
    margin: 0 0 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-lo);
  }
  .settings-content .field {
    margin-bottom: 16px;
  }
  .settings-content label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: block;
    margin-bottom: 4px;
  }
  .settings-content input[type="text"],
  .settings-content input[type="password"],
  .settings-content input[type="email"],
  .settings-content select {
    width: 100%;
    background: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 12px;
  }
  .settings-content input:focus {
    outline: none;
    border-color: var(--lime);
  }
  .settings-content .form-msg {
    margin-top: 12px;
  }
  .settings-content .btn {
    margin-top: 8px;
  }
  .settings-content .avatar-preview {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--lime);
    margin-bottom: 12px;
  }
  .settings-content .avatar-preview.default {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-raised);
    font-family: var(--font-display);
    font-size: 32px;
    color: var(--text-dim);
  }
  .settings-content .avatar-upload-btn {
    display: inline-block;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    transition: border-color 0.2s;
  }
  .settings-content .avatar-upload-btn:hover {
    border-color: var(--lime);
    color: var(--text);
  }
  #avatarInput {
    display: none;
  }

  @media (max-width: 720px) {
    .settings-container {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<div id="nav-root"></div>

<main>
  <section>
    <div class="wrap">
      <h1>Настройки аккаунта</h1>

      <div class="settings-container">
        <div class="settings-sidebar">
          <a href="profile.html">👤 Профиль</a>
          <a href="settings.html" class="active">⚙️ Настройки</a>
          <a href="#" id="securityLink">🔒 Безопасность</a>
          <a href="#" id="privacyLink">🔐 Конфиденциальность</a>
        </div>

        <div class="settings-content">
          <h2>⚙️ Настройки профиля</h2>

          <div id="settingsForm">
            <!-- Аватарка -->
            <div class="field">
              <label>Аватарка</label>
              <div id="avatarPreviewContainer"></div>
              <label class="avatar-upload-btn" for="avatarInput">📁 Выбрать изображение</label>
              <input type="file" id="avatarInput" accept="image/*">
            </div>

            <!-- Имя пользователя -->
            <div class="field">
              <label>Имя пользователя</label>
              <input type="text" id="settingsUsername" disabled>
            </div>

            <!-- Статус -->
            <div class="field">
              <label>Статус</label>
              <input type="text" id="settingsStatus" placeholder="Ваш статус..." maxlength="60">
            </div>

            <!-- Роль -->
            <div class="field">
              <label>Роль</label>
              <input type="text" id="settingsRole" disabled>
            </div>

            <!-- IGN -->
            <div class="field">
              <label>Игровой ник (IGN)</label>
              <input type="text" id="settingsIgn" placeholder="Ваш IGN">
            </div>

            <div style="border-top:1px solid var(--border-lo);margin:20px 0;"></div>

            <h3 style="font-size:13px;color:var(--lime);margin-bottom:16px;">🔑 Смена пароля</h3>

            <div class="field">
              <label>Текущий пароль</label>
              <input type="password" id="currentPassword" placeholder="Введите текущий пароль">
            </div>
            <div class="field">
              <label>Новый пароль</label>
              <input type="password" id="newPassword" placeholder="Введите новый пароль (мин. 4 символа)">
            </div>
            <div class="field">
              <label>Подтверждение пароля</label>
              <input type="password" id="confirmPassword" placeholder="Подтвердите новый пароль">
            </div>

            <button class="btn primary" id="saveSettingsBtn">💾 Сохранить настройки</button>
            <div class="form-msg" id="settingsMsg"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footer-root"></div>

<script src="db.js"></script>
<script src="nav.js"></script>
<script>
  renderNav('settings.html');
  renderFooter();

  const user = Auth.currentUser();
  if (!user) location.href = 'auth.html';

  const PROFILE_KEY = 'ra_profile_data';

  function getProfileData(username) {
    const raw = localStorage.getItem(PROFILE_KEY);
    const all = raw ? JSON.parse(raw) : {};
    if (!all[username]) {
      all[username] = { avatar: null, status: 'Всем привет! 🤘', registered: new Date().toLocaleDateString('ru-RU'), messages: 0, reactions: 0 };
      localStorage.setItem(PROFILE_KEY, JSON.stringify(all));
    }
    return all[username];
  }

  function saveProfileData(username, data) {
    const raw = localStorage.getItem(PROFILE_KEY);
    const all = raw ? JSON.parse(raw) : {};
    all[username] = data;
    localStorage.setItem(PROFILE_KEY, JSON.stringify(all));
  }

  const profile = getProfileData(user.username);

  // === ЗАГРУЗКА ДАННЫХ ===
  document.getElementById('settingsUsername').value = user.username;
  document.getElementById('settingsRole').value = user.role === 'admin' ? 'Администратор' : 'Игрок';
  document.getElementById('settingsStatus').value = profile.status || '';
  document.getElementById('settingsIgn').value = user.ign || user.username;

  // === АВАТАРКА ===
  const avatarContainer = document.getElementById('avatarPreviewContainer');
  function renderAvatar() {
    const profileData = getProfileData(user.username);
    if (profileData.avatar) {
      avatarContainer.innerHTML = `<img src="${profileData.avatar}" class="avatar-preview" alt="Аватар">`;
    } else {
      avatarContainer.innerHTML = `<div class="avatar-preview default">${user.username.charAt(0).toUpperCase()}</div>`;
    }
  }
  renderAvatar();

  document.getElementById('avatarInput').addEventListener('change', function(e) {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      const base64 = event.target.result;
      const profileData = getProfileData(user.username);
      profileData.avatar = base64;
      saveProfileData(user.username, profileData);
      renderAvatar();
    };
    reader.readAsDataURL(file);
  });

  // === СОХРАНЕНИЕ ===
  document.getElementById('saveSettingsBtn').addEventListener('click', function() {
    const msgEl = document.getElementById('settingsMsg');
    const status = document.getElementById('settingsStatus').value.trim();
    const ign = document.getElementById('settingsIgn').value.trim();
    const currentPass = document.getElementById('currentPassword').value;
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;

    // Обновляем профиль
    const profileData = getProfileData(user.username);
    profileData.status = status || 'Всем привет! 🤘';
    saveProfileData(user.username, profileData);

    // Обновляем IGN в users (через localStorage для совместимости)
    try {
      const usersRaw = localStorage.getItem('ra_db_v1');
      if (usersRaw) {
        const usersData = JSON.parse(usersRaw);
        const userIndex = usersData.users.findIndex(u => u.username === user.username);
        if (userIndex !== -1) {
          usersData.users[userIndex].ign = ign || user.username;
          localStorage.setItem('ra_db_v1', JSON.stringify(usersData));
        }
      }
    } catch(e) {}

    // Смена пароля
    if (currentPass || newPass || confirmPass) {
      if (!currentPass) {
        msgEl.className = 'form-msg err';
        msgEl.textContent = 'Введите текущий пароль для смены.';
        return;
      }
      if (newPass.length < 4) {
        msgEl.className = 'form-msg err';
        msgEl.textContent = 'Новый пароль должен быть не короче 4 символов.';
        return;
      }
      if (newPass !== confirmPass) {
        msgEl.className = 'form-msg err';
        msgEl.textContent = 'Пароли не совпадают.';
        return;
      }

      // Проверяем текущий пароль (для демо — через localStorage)
      try {
        const usersRaw = localStorage.getItem('ra_db_v1');
        if (usersRaw) {
          const usersData = JSON.parse(usersRaw);
          const userIndex = usersData.users.findIndex(u => u.username === user.username);
          if (userIndex !== -1) {
            if (usersData.users[userIndex].password !== currentPass) {
              msgEl.className = 'form-msg err';
              msgEl.textContent = 'Неверный текущий пароль.';
              return;
            }
            usersData.users[userIndex].password = newPass;
            localStorage.setItem('ra_db_v1', JSON.stringify(usersData));
            msgEl.className = 'form-msg ok';
            msgEl.textContent = '✅ Пароль успешно изменён!';
          }
        }
      } catch(e) {
        msgEl.className = 'form-msg err';
        msgEl.textContent = 'Ошибка смены пароля.';
        return;
      }
    } else {
      msgEl.className = 'form-msg ok';
      msgEl.textContent = '✅ Настройки сохранены!';
    }

    // Очищаем поля пароля
    document.getElementById('currentPassword').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmPassword').value = '';

    setTimeout(() => {
      msgEl.className = 'form-msg';
      msgEl.textContent = '';
    }, 3000);
  });

  // === ЗАГЛУШКИ ===
  document.getElementById('securityLink').addEventListener('click', (e) => {
    e.preventDefault();
    alert('🔒 Раздел безопасности будет доступен в следующем обновлении!');
  });
  document.getElementById('privacyLink').addEventListener('click', (e) => {
    e.preventDefault();
    alert('🔐 Раздел конфиденциальности будет доступен в следующем обновлении!');
  });
</script>
</body>
</html>
