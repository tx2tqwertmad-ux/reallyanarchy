<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профиль — REALLYANARCHY</title>
<link rel="stylesheet" href="style.css">
<style>
  .profile-container {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
    margin-top: 20px;
  }
  .profile-sidebar {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 18px;
    text-align: center;
  }
  .profile-avatar-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 3px solid var(--lime);
    overflow: hidden;
    cursor: pointer;
    background: var(--bg-inset);
  }
  .profile-avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .profile-avatar-wrap .default-avatar {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-family: var(--font-display);
    font-size: 48px;
    color: var(--text-dim);
    background: var(--bg-raised);
  }
  .profile-avatar-wrap .upload-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.7);
    color: var(--text);
    font-size: 11px;
    padding: 6px;
    opacity: 0;
    transition: opacity 0.3s;
    text-align: center;
  }
  .profile-avatar-wrap:hover .upload-overlay {
    opacity: 1;
  }
  .profile-name {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--text);
    margin: 0;
  }
  .profile-role {
    display: inline-block;
    font-size: 12px;
    padding: 2px 12px;
    border-radius: 12px;
    background: rgba(247, 183, 51, 0.15);
    color: var(--lime);
    margin-top: 6px;
  }
  .profile-status {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border-lo);
  }
  .profile-status .status-text {
    color: var(--text-dim);
    font-size: 13px;
    font-style: italic;
    margin: 0 0 8px;
    min-height: 20px;
  }
  .profile-stats {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border-lo);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .profile-stats .stat-item {
    text-align: center;
  }
  .profile-stats .stat-item .num {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--lime);
  }
  .profile-stats .stat-item .lbl {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .profile-actions {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border-lo);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .profile-actions .btn {
    width: 100%;
    text-align: center;
  }

  .profile-content {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .profile-content h2 {
    font-family: var(--font-display);
    font-size: 14px;
    color: var(--lime);
    margin: 0 0 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-lo);
  }
  .profile-content .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .profile-content .info-item .label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .profile-content .info-item .value {
    font-size: 14px;
    color: var(--text);
  }

  #avatarInput {
    display: none;
  }

  @media (max-width: 720px) {
    .profile-container {
      grid-template-columns: 1fr;
    }
    .profile-content .info-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<div id="nav-root"></div>

<main>
  <section>
    <div class="wrap">
      <h1>Профиль</h1>

      <div class="profile-container" id="profileContainer">
        <!-- Заполняется JS -->
      </div>
    </div>
  </section>
</main>

<div id="footer-root"></div>

<script src="db.js"></script>
<script src="nav.js"></script>
<script>
  renderNav('profile.html');
  renderFooter();

  const user = Auth.currentUser();
  if (!user) location.href = 'auth.html';

  const PROFILE_KEY = 'ra_profile_data';

  function getProfileData(username) {
    const raw = localStorage.getItem(PROFILE_KEY);
    const all = raw ? JSON.parse(raw) : {};
    if (!all[username]) {
      all[username] = { avatar: null, status: 'Всем привет! 🤘', registered: new Date().toLocaleDateString('ru-RU'), messages: 0, reactions: 0 };
      localStorage.setItem(PROFILE_KEY, JSON.stringify(all));
    }
    return all[username];
  }

  function saveProfileData(username, data) {
    const raw = localStorage.getItem(PROFILE_KEY);
    const all = raw ? JSON.parse(raw) : {};
    all[username] = data;
    localStorage.setItem(PROFILE_KEY, JSON.stringify(all));
  }

  function renderProfile() {
    const container = document.getElementById('profileContainer');
    const profile = getProfileData(user.username);
    const initial = user.username.charAt(0).toUpperCase();

    container.innerHTML = `
      <div class="profile-sidebar">
        <div class="profile-avatar-wrap" id="avatarWrap">
          ${profile.avatar 
            ? `<img src="${profile.avatar}" alt="Аватар">` 
            : `<div class="default-avatar">${initial}</div>`
          }
          <div class="upload-overlay">Сменить аватар</div>
        </div>
        <input type="file" id="avatarInput" accept="image/*">
        
        <h2 class="profile-name">${escapeHtml(user.username)}</h2>
        <span class="profile-role">${user.role === 'admin' ? '👑 Администратор' : '🎮 Игрок'}</span>

        <div class="profile-status">
          <p class="status-text" id="statusDisplay">${escapeHtml(profile.status || '')}</p>
        </div>

        <div class="profile-stats">
          <div class="stat-item">
            <div class="num">${profile.messages || 0}</div>
            <div class="lbl">Сообщений</div>
          </div>
          <div class="stat-item">
            <div class="num">${profile.reactions || 0}</div>
            <div class="lbl">Реакций</div>
          </div>
        </div>

        <div class="profile-actions">
          <a href="settings.html" class="btn primary">⚙️ Настройки</a>
          <a href="privacy.html" class="btn">🔐 Конфиденциальность</a>
          <a href="security.html" class="btn">🔒 Безопасность</a>
          <button class="btn danger" id="logoutBtn">🚪 Выйти</button>
          <a href="index.html" class="btn">🏠 На главную</a>
        </div>
      </div>

      <div class="profile-content">
        <h2>📋 Информация</h2>
        <div class="info-grid">
          <div class="info-item">
            <div class="label">Имя пользователя</div>
            <div class="value">${escapeHtml(user.username)}</div>
          </div>
          <div class="info-item">
            <div class="label">Роль</div>
            <div class="value">${user.role === 'admin' ? 'Администратор' : 'Игрок'}</div>
          </div>
          <div class="info-item">
            <div class="label">Дата регистрации</div>
            <div class="value">${profile.registered || 'Неизвестно'}</div>
          </div>
          <div class="info-item">
            <div class="label">IGN (игровой ник)</div>
            <div class="value">${user.ign || user.username}</div>
          </div>
          <div class="info-item" style="grid-column: 1 / -1;">
            <div class="label">Статус</div>
            <div class="value" style="font-style:italic;color:var(--text-dim);">${escapeHtml(profile.status || 'Не указан')}</div>
          </div>
        </div>
      </div>
    `;

    // === ЗАГРУЗКА АВАТАРКИ ===
    const avatarWrap = document.getElementById('avatarWrap');
    const avatarInput = document.getElementById('avatarInput');

    avatarWrap.addEventListener('click', () => avatarInput.click());

    avatarInput.addEventListener('change', function(e) {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const base64 = event.target.result;
        const profileData = getProfileData(user.username);
        profileData.avatar = base64;
        saveProfileData(user.username, profileData);
        renderProfile();
      };
      reader.readAsDataURL(file);
    });

    // === ВЫХОД ===
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        Auth.logout();
        location.href = 'index.html';
      });
    }
  }

  renderProfile();
</script>
</body>
</html>
